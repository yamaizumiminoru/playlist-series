const typeColors={"fugue":"type-fugue","fughetta":"type-fughetta","ricercar":"type-ricercar","canzona":"type-canzona","canon":"type-canon","fugato-gigue":"type-gigue","other-imitative":"type-other"};const areaColors={"it":"area-it","de":"area-de","fr":"area-fr","en":"area-en","nl":"area-nl","es":"area-es","mix":"area-mix"};let activeType='all',activeArea='all',searchQ='',currentVisibleTracks=[];
function secondsFromTime(time){if(!time)return 0;const parts=time.split(':').map(Number).reverse();return (parts[0]||0)+(parts[1]||0)*60+(parts[2]||0)*3600;}
function render(){const grid=document.getElementById('grid');grid.innerHTML='';currentVisibleTracks=[];let visible=0;const q=searchQ.trim().toLowerCase();tracks.forEach(t=>{const matchType=activeType==='all'||t.type===activeType;const matchArea=activeArea==='all'||t.area===activeArea;const hay=[t.composer,t.title,t.desc,t.parentWork,t.performer,t.instr].filter(Boolean).join(' ').toLowerCase();if(!matchType||!matchArea||(q&&!hay.includes(q)))return;currentVisibleTracks.push(t);visible++;let ytUrl='https://www.youtube.com/watch?v='+t.vid;const sec=secondsFromTime(t.startTime);if(sec>0||t.videoScope==='full-work-with-timestamp')ytUrl+='&t='+sec+'s';const card=document.createElement('div');card.className='card';card.innerHTML=`<div class="card-header"><span class="num">#${t.n}</span><span class="type-badge ${typeColors[t.type]||'type-other'}">${t.typeLabel}</span><span class="area-dot ${areaColors[t.area]||'area-mix'}" title="${t.areaLabel}"></span><span style="color:var(--muted);font-size:.7rem;flex:1">${t.year}</span></div><div class="card-body"><div class="composer">${t.composer} <span class="composer-dates">${t.dates||''}</span></div><div class="title">${t.title}</div>${t.parentWork?`<div class="meta"><span style="font-style:italic">${t.parentWork}</span>${t.movement?' - <strong style="color:var(--text)">'+t.movement+'</strong>':''}</div>`:''}<div class="meta"><span class="instrument">${t.instr}</span></div><div class="desc">${t.desc}</div><div class="performer">演奏: ${t.performer||'YouTube candidate'}</div></div><div class="card-footer"><a class="yt-btn" href="${ytUrl}" target="_blank" rel="noopener">YouTubeで視聴</a><span class="area-label">${t.areaLabel}</span></div>`;grid.appendChild(card);});document.getElementById('stats').textContent=visible+' 曲表示 / 全 '+tracks.length+' 曲';}
document.querySelectorAll('.btn[data-filter]').forEach(btn=>btn.addEventListener('click',()=>{const f=btn.dataset.filter,v=btn.dataset.val;document.querySelectorAll('.btn[data-filter="'+f+'"]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(f==='type')activeType=v;else activeArea=v;render();}));document.getElementById('search').addEventListener('input',e=>{searchQ=e.target.value;render();});document.getElementById('randomPlayBtn').addEventListener('click',()=>{if(!currentVisibleTracks.length){alert('表示中の曲がありません');return;}const t=currentVisibleTracks[Math.floor(Math.random()*currentVisibleTracks.length)];let url='https://www.youtube.com/watch?v='+t.vid;const sec=secondsFromTime(t.startTime);if(sec>0||t.videoScope==='full-work-with-timestamp')url+='&t='+sec+'s';window.open(url,'_blank','noopener,noreferrer');});render();
