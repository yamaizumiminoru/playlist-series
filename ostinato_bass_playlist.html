 { n:124, composer:"Marco Uccellini", dates:"(c.1603–1680)", title:"Sonata sopra La Prosperina", year:"1649", area:"it", areaLabel:"イタリア", type:"other", typeLabel:"グラウンド変奏", instr:"ヴァイオリン+通奏低音", vid:"5YFlwhnc0-Y", performer:"Baroque violin", desc:"「ラ・プロスペリーナ」の旋律バス上に展開する初期バロック・ヴァイオリン作品。北イタリア・モデナのウッチェリーニはコレッリ以前の最重要ヴァイオリン作曲家の一人。" },
 { n:125, composer:"Henry Purcell", dates:"(1659–1695)", title:"Trio Sonata No. 6 in G minor 'Great Chaconne'", year:"1697", area:"en", areaLabel:"イギリス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"2ヴァイオリン+通奏低音", vid:"fMVecO4P7_k", performer:"Baroque trio", desc:"「十のソナタ」(1697)中の大シャコンヌ。変奏ごとに声部を減らしていく独創的な構成を持つ、英国バロックの至宝。パーセル死後に出版された遺作集より。" },
 { n:126, composer:"Johann Jacob Froberger", dates:"(1616–1667)", title:"Lamentation sur la mort de Ferdinand III", year:"1657", area:"de", areaLabel:"ドイツ/オーストリア", type:"ground", typeLabel:"グラウンドバス", instr:"チェンバロ", vid:"VZm1_vkarh0", performer:"Harpsichord", desc:"フェルディナント3世皇帝の死を悼む鍵盤哀歌。下降半音階のラメント・バスが繰り返される深い悲嘆の音楽。フローベルガーはウィーンとローマで活躍した17世紀最重要の鍵盤作曲家。" },
 { n:127, composer:"John Jenkins", dates:"(1592–1678)", title:"Divisions on a Ground for two bass viols", year:"c.1660", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンドバス", instr:"2バス・ヴィオール", vid:"8o6M6JmEq_w", performer:"Two bass viols", desc:"英国コンソート音楽の大家ジェンキンスによるグラウンド・ディヴィジョン。2本のバス・ヴィオールが反復バス上で競い合う独特の音響世界。英内戦期を通じ貴族の館で活躍。" },
 { n:128, composer:"Antonio Cesti", dates:"(1623–1669)", title:"Intorno all'idol mio (Il pomo d'oro)", year:"1667", area:"it", areaLabel:"イタリア", type:"ground", typeLabel:"グラウンドバス", instr:"声楽+通奏低音", vid:"ZVurB4yudNg", performer:"Soprano", desc:"「黄金の林檎」からのアリア「わが偶像のそばで」。下降テトラコードのラメント・バス上に展開する愛の哀歌。1668年ウィーンで上演された大規模の初期バロック・オペラより。" },
 { n:129, composer:"Francesco Cavalli", dates:"(1602–1676)", title:"Piante ombrose (La Calisto)", year:"1651", area:"it", areaLabel:"イタリア", type:"ground", typeLabel:"グラウンドバス", instr:"声楽+通奏低音", vid:"2AmcV5PRuoI", performer:"Baroque opera ensemble", desc:"オペラ「ラ・カリスト」からのアリア「陰なす草木よ」。ヴェネツィア・バロック・オペラにおけるラメント・バスの典型的な使用例。モンテヴェルディの後継者カヴァッリの代表作。" },
 { n:130, composer:"Nicola Matteis", dates:"(c.1650–c.1714)", title:"Ground after the Scotch Humour", year:"c.1685", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンドバス", instr:"ヴァイオリン+通奏低音", vid:"99Hi2i7opFI", performer:"Baroque violin", desc:"ナポリ出身でロンドンで活躍したヴァイオリン名手マッテイスによるスコットランド風グラウンド変奏。南欧と英国の民俗的要素が融合した異色の作品。" },
 { n:131, composer:"Jean-Joseph Mouret", dates:"(1682–1738)", title:"Chaconne (Concert de Chambre)", year:"c.1720", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"室内アンサンブル", vid:"vfR30kpaWiQ", performer:"Baroque ensemble", desc:"「人民の音楽家」と呼ばれたムーレーのシャコンヌ。ルイ15世の宮廷で「音楽の楽しみ」コンセールを担ったプロヴァンス出身の作曲家による優雅な反復変奏。" },
 { n:132, composer:"Giacomo Carissimi", dates:"(1605–1674)", title:"Historia de Jephte", year:"c.1650", area:"it", areaLabel:"イタリア", type:"ground", typeLabel:"グラウンドバス", instr:"声楽+器楽アンサンブル", vid:"xsNX0UHv2U0", performer:"Il Giardino Armonico", desc:"オラトリオ最初期の傑作。イフタの娘のラメントにラメント・バスが用いられ、旧約聖書の悲劇を音楽で描く。イル・ジャルディーノ・アルモニコによる名演。" },
 { n:133, composer:"Matthew Locke", dates:"(c.1621–1677)", title:"Divisions on a Ground in G Major", year:"c.1660", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンドバス", instr:"ヴィオール+鍵盤", vid:"Xasm0HI0yiA", performer:"Viola da gamba", desc:"英国バロックの鬼才マシュー・ロックによるグラウンドバス変奏。チャールズ2世の宮廷楽師として英国コンソート音楽を牽引した重要作曲家のヴィオール作品。" },
 { n:134, composer:"Johann Adam Reincken", dates:"(1643–1722)", title:"Partite sopra 'Schweiget mir vom Weibernehmen'", year:"c.1680", area:"de", areaLabel:"ドイツ/オーストリア", type:"other", typeLabel:"グラウンド変奏", instr:"チェンバロ", vid:"c1FrX4Napt8", performer:"Harpsichord", desc:"ハンブルク楽派のラインケンによる変奏曲。若きバッハが聴きに遠路赴いたことで有名な北ドイツ・オルガン楽派の長老の傑作。ドイツ語の民謡旋律バス上に変奏を展開。" },
 { n:135, composer:"Giovanni Battista Vitali", dates:"(1632–1692)", title:"Ciaccona, Op.7 No.3", year:"1682", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"ヴァイオリン+通奏低音", vid:"B6dPnnNnfmg", performer:"Baroque violin", desc:"ボローニャ楽派の先達G.B.ヴィターリの器楽チャッコーナ。「ヴィターリのシャコンヌ」（19世紀偽作）の作曲家として知られる父の真作。" },
 { n:136, composer:"Johann Rosenmüller", dates:"(c.1619–1684)", title:"Passacaglia in D minor", year:"c.1670", area:"de", areaLabel:"ドイツ/オーストリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"弦楽アンサンブル", vid:"M704uOvz1WI", performer:"Baroque ensemble", desc:"ドイツとヴェネツィアで活躍したローゼンミュラーのパッサカーリア。スキャンダルでライプツィヒを逃れヴェネツィアに亡命した悲運の天才が遺した傑作。" },
 { n:137, composer:"Salamone Rossi", dates:"(c.1570–c.1630)", title:"Sonata quarta sopra l'aria di Ruggiero", year:"1613", area:"it", areaLabel:"イタリア", type:"other", typeLabel:"ルッジェーロ変奏", instr:"ヴィオール3重奏", vid:"jxitvIvkgRg", performer:"Viol consort", desc:"マントヴァのユダヤ人作曲家ロッシによるルッジェーロ変奏ソナタ（1613年）。最初期の器楽ソナタのひとつとして音楽重要な位置を占める先駆的作品。" },
 { n:138, composer:"Sigismondo d'India", dates:"(c.1582–c.1629)", title:"Lamento di Didone", year:"1623", area:"it", areaLabel:"イタリア", type:"ground", typeLabel:"グラウンドバス", instr:"声楽+通奏低音", vid:"WM1-BtadogQ", performer:"Soprano", desc:"「ディードーの嘆き」。下降半音階バス上に展開する哀歌は初期バロックのラメント様式の先駆け。シチリア出身でトリノ宮廷に仕えたモンテヴェルディと並ぶ初期バロックの巨人。" },
 { n:139, composer:"Giovanni Felice Sances", dates:"(c.1600–1679)", title:"Cantada sopra il passacaglia", year:"c.1636", area:"it", areaLabel:"イタリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"声楽+通奏低音", vid:"U7RjJWf6WlA", performer:"Countertenor", desc:"パッサカリアの反復バス上に展開するイタリア初期バロック歌曲。サンチェスはウィーン宮廷で半世紀以上活躍した声楽作曲家で、器楽の反復バスを声楽に応用した先駆者。" },
 { n:140, composer:"Thomas Baltzar", dates:"(c.1631–1663)", title:"Division on a Ground in G major", year:"c.1655", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンドバス", instr:"ヴァイオリン+通奏低音", vid:"TUSU5W_tv9Q", performer:"Baroque violin", desc:"バルト海沿岸出身でロンドンを席巻したヴァイオリン名手バルツァーのグラウンド変奏。英国バロック・ヴァイオリン草創期を象徴する記念碑的作品。32歳で夭折。" },
 { n:141, composer:"Johann Kaspar Ferdinand Fischer", dates:"(c.1656–1746)", title:"Chaconne de Phaéton / Passacaille", year:"c.1700", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"シャコンヌ", instr:"鍵盤", vid:"tTB_cmm_j6k", performer:"Harpsichord", desc:"フランス様式に傾倒したドイツ南部の鍵盤作曲家フィッシャーによるシャコンヌとパッサカイユ。バッハに大きな影響を与えた「アリアドネ・ムジカ」の作曲家。" },
 { n:142, composer:"Antonio Martín y Coll", dates:"(c.1671–c.1734)", title:"Diferencias sobre las Folías", year:"c.1710", area:"es", areaLabel:"スペイン", type:"folia", typeLabel:"フォリア", instr:"オルガン", vid:"xtBjcTwyDa4", performer:"Organ", desc:"スペインのフランシスコ会修道士兼オルガニスト、マルティン・イ・コルによるフォリア変奏曲。「花集め」（フロレロ）写本収録のスペイン鍵盤音楽の傑作。" },
 { n:143, composer:"Jacques Morel", dates:"(c.1700–1749)", title:"Chaconne en trio in G major", year:"1709", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"フルート・ヴィオル・ダ・ガンバ・通奏低音", vid:"Et9-vLc63J4", performer:"Fuoco E Cenere, dir. Jay Bernfeld", desc:"フランス・バロックの隠れた傑作。マラン・マレーに師事した可能性のあるヴィオル奏者モレルによる三重奏シャコンヌ。三声部が対等に反復低音と旋律を分担する独自の形式。フオコ・エ・チェーネレによる演奏。" },
 { n:144, composer:"Philipp Heinrich Erlebach", dates:"(1657–1714)", title:"Ciaconne (Trio Sonata No.3)", year:"1694", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"2ヴァイオリン+通奏低音", vid:"zzODYatuxfk", performer:"Baroque trio", desc:"ルドルシュタット宮廷楽長エルレバッハによるチャッコーナ。1694年の6つのトリオ・ソナタに収録されたドイツ中部バロックの知られざる傑作。" },
 { n:145, composer:"Johann Christoph Pez", dates:"(1664–1716)", title:"Passacaglia", year:"c.1700", area:"de", areaLabel:"ドイツ/オーストリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"リコーダー+通奏低音", vid:"6kuo8BxJNVM", performer:"Recorder and continuo", desc:"ミュンヘン・シュトゥットガルト・ボン各宮廷で活躍したペッツによる優美なパッサカリア。南ドイツとフランスの様式を巧みに融合させた美しい作品。" },
 { n:146, composer:"Johann Philipp Krieger", dates:"(1649–1725)", title:"Passacaglia (Anmuthige Clavier-Übung)", year:"1698", area:"de", areaLabel:"ドイツ/オーストリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"チェンバロ", vid:"qn0bZHETWks", performer:"Harpsichord", desc:"ニュルンベルクからワイセンフェルスで活躍したJ.Ph.クリーガーの鍵盤パッサカリア。「愉快な鍵盤練習」(1698)収録。J.S.バッハの先達として見過ごされてきた重要作。" },
 { n:147, composer:"Stefano Landi", dates:"(1587–1639)", title:"Passacaglia della Vita", year:"c.1620", area:"it", areaLabel:"イタリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"声楽+ギター", vid:"oS65STULE54", performer:"Voice and guitar", desc:"「人生のパッサカーリア」。モノディ様式で書かれた最初期のパッサカリア声楽曲。人生の無常と道徳的教訓を歌う教訓的作品で、パッサカリア歌曲の最初期の記録のひとつ。" },
 { n:148, composer:"Peter Philips", dates:"(1560–1628)", title:"Passamezzo Pavana (FVB No.76)", year:"c.1600", area:"en", areaLabel:"イギリス", type:"other", typeLabel:"パッサメッツォ", instr:"チェンバロ", vid:"LaD2m4LQx2k", performer:"Harpsichord", desc:"フィッツウィリアム・ヴァージナル・ブック（FVB）No.76収録のパッサメッツォ・パヴァーナ。カトリックとして大陸に亡命した英国鍵盤作曲家フィリップスの傑作。" },
 { n:149, composer:"Agostino Steffani", dates:"(1654–1728)", title:"Lagrime dolorose", year:"c.1690", area:"it", areaLabel:"イタリア", type:"ground", typeLabel:"グラウンドバス", instr:"声楽+通奏低音", vid:"Es6dRrIgdMU", performer:"Countertenor", desc:"「悲しみの涙」。下降半音階のラメント・バス上に展開するカウンターテナーのカンタータ。外交官・司教でもあったステッファーニがハノーファー宮廷で活躍中に作曲。" },

 { n:150, composer:"Jean-François Dandrieu", dates:"(1682–1738)", title:"Passacaille in d minor", year:"c.1715", area:"fr", areaLabel:"フランス", type:"passacaglia", typeLabel:"パッサカイユ", instr:"チェンバロ", vid:"28rFjFb_RqQ", performer:"Harpsichord", desc:"フランス王室礼拝堂オルガニストのダンドリューによる哀愁あふれるパッサカイユ。ラモー・クープランと並ぶフランス鍵盤音楽の三傑の一人による見過ごされがちな名品。" },
 { n:151, composer:"Gaspard Le Roux", dates:"(c.1660–c.1707)", title:"Chaconne in F major", year:"1705", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"6ZyTQBLgK7w", performer:"Harpsichord", desc:"謎に包まれたフランスの鍵盤作曲家ル・ルーによるF長調のシャコンヌ。1705年の唯一の出版作品「クラヴサン曲集」に収録された珠玉の一曲。フォルクレに似た深みを持つ。" },
 { n:152, composer:"Louis-Nicolas Clérambault", dates:"(1676–1749)", title:"Chaconne", year:"c.1710", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"SWAFljLdbLk", performer:"Harpsichord", desc:"カンタータと鍵盤音楽で名高いクレランボーのシャコンヌ。フランス・バロック末期の優雅な様式を体現する一曲。サン＝シル王立学院のオルガニストとしても活躍。" },
 { n:153, composer:"François Le Cocq", dates:"(fl. c.1720)", title:"Chaconne (baroque guitar)", year:"c.1720", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・ギター", vid:"-37yAt8HD6c", performer:"Baroque guitar", desc:"ブリュッセルで活躍したフランス系の作曲家ル・コックによるバロック・ギターのシャコンヌ。5コース・バロック・ギターのための重要なレパートリーとして再評価が進む。" },
 { n:154, composer:"John Bull", dates:"(c.1562–1628)", title:"Walsingham Variations (FVB No.1)", year:"c.1600", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンドバス", instr:"チェンバロ", vid:"a4D4yuP35rA", performer:"Harpsichord", desc:"巡礼歌「ウォルジンガムへ行くとき」の反復バス上に展開する30変奏。フィッツウィリアム・ヴァージナル・ブックの冒頭を飾る英国ヴァージナリスト楽派の至宝。" },
 { n:155, composer:"Samuel Capricornus", dates:"(1628–1665)", title:"Ciaccona for violin, viola and continuo", year:"c.1660", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"ヴァイオリン、ヴィオラ、通奏低音", vid:"YvgUR-RMQ90", performer:"Baroque ensemble", desc:"シュトゥットガルト宮廷楽長カプリコルヌスによるチャッコーナ。ドイツ南部バロックにおけるイタリア様式受容の典型例。37歳で夭折したため作品が少なく貴重な一曲。" },
 { n:156, composer:"Gregorio Strozzi", dates:"(c.1615–c.1693)", title:"Toccata de Passacagli", year:"1687", area:"it", areaLabel:"イタリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"チェンバロ/オルガン", vid:"2AKswrhIZ2g", performer:"Harpsichord", desc:"ナポリのオルガニスト、グレゴリオ・ストロッツィによるパッサカーリ上のトッカータ（1687年ナポリ刊「カプリッチ・ダ・ソナーレ」収録）。バルバラ・ストロッツィとは別人。" },
 { n:157, composer:"Giovanni de Macque", dates:"(c.1550–1614)", title:"Partite sopra il Ruggiero", year:"c.1600", area:"it", areaLabel:"イタリア", type:"other", typeLabel:"ルッジェーロ変奏", instr:"バロック・ハープ", vid:"ojSnb7yHrno", performer:"Ana Zauner-Pagitsch (baroque harp)", desc:"ナポリ楽派の開祖デ・マック（フランドル出身）によるルッジェーロ変奏。フレスコバルディの師であり、ナポリ鍵盤音楽の創始者。バロック・ハープによる珍しい演奏。" },
 { n:158, composer:"Ascanio Mayone", dates:"(c.1565–1627)", title:"Partite sopra il Tenore Antico, o Romanesca", year:"1603", area:"it", areaLabel:"イタリア", type:"romanesca", typeLabel:"ロマネスカ変奏", instr:"チェンバロ/オルガン", vid:"H40Fpcq2Uhc", performer:"Harpsichord", desc:"ナポリ楽派マヨーネによるロマネスカ変奏曲（1603年「ディヴェルシ・カプリッチ」第1巻収録）。デ・マックの弟子でフレスコバルディへの橋渡しをなした初期バロック鍵盤の重要作。" },
 { n:159, composer:"Nicolas Lebègue", dates:"(1631–1702)", title:"Suite en sol mineur — Passacaille", year:"1687", area:"fr", areaLabel:"フランス", type:"passacaglia", typeLabel:"パッサカイユ", instr:"チェンバロ", vid:"oveM0dEZ1gI", performer:"John Moraitis (harpsichord)", desc:"フランス王室礼拝堂オルガニスト、ルベーグによるパッサカイユ。クープラン以前のフランス鍵盤音楽において重要な位置を占める。1687年「クラヴサン曲集」第2巻より。" },
 { n:160, composer:"William Lawes", dates:"(1602–1645)", title:"Consort No. 8 in G major — Ground", year:"c.1640", area:"en", areaLabel:"England", type:"ground", typeLabel:"グラウンド", instr:"ヴァイオリン・ヴィオール・テオルボ・オルガン", vid:"MyyJht3zI_g", performer:"", desc:"内戦前夜の宮廷音楽家ウィリアム・ロースによるコンソート・グラウンド。ディヴィジョン・ヴィオールが反復低音上で即興的変奏を展開する英国独自の形式の精華。" },
 { n:161, composer:"Joan Cabanilles", dates:"(1644–1712)", title:"Diferencias sobre las Folías", year:"c.1680", area:"es", areaLabel:"Spain", type:"folia", typeLabel:"フォリア変奏", instr:"オルガン", vid:"Wm5bwz5K0JY", performer:"", desc:"バレンシア大聖堂の偉大なオルガン奏者カバニリェスによるフォリア変奏曲。スペイン・バロック鍵盤音楽の代表的のひとりが生み出したフォリア解釈。" },
 { n:162, composer:"Henry Desmarets", dates:"(1661–1741)", title:"Passacaille — Théagène et Cariclée", year:"1699", area:"fr", areaLabel:"France", type:"passacaglia", typeLabel:"パッサカイユ", instr:"管弦楽", vid:"xFkDKQb8bGM", performer:"Stony Brook Baroque Players", desc:"フランス・バロック・オペラの埋もれた傑作。ルイ14世の宮廷に仕えたデマレによる大規模パッサカイユ。ルリ様式の完成形を示す。" },

 { n:165, composer:"Dario Castello", dates:"(fl.1600–1631)", title:"Sonata decimaquinta", year:"1629", area:"it", areaLabel:"Italy", type:"ciaccona", typeLabel:"チャコーナ", instr:"ヴァイオリン・通奏低音", vid:"2YsVtWWB_9w", performer:"Baroque Concert Live in Japan", desc:"初期ヴェネツィア器楽ソナタの先駆者カステッロによる第15ソナタ。反復低音上の即興的・劇的な展開でモンテヴェルディ世代の革新性を示す。" },
 { n:166, composer:"Johann Hermann Schein", dates:"(1586–1630)", title:"Banchetto Musicale — Suite No. 1", year:"1617", area:"de", areaLabel:"Germany", type:"other", typeLabel:"舞曲変奏組曲", instr:"コンソート", vid:"_GuRs0W-K44", performer:"", desc:"バッハの前任者のひとりライプツィヒ聖トーマス合唱長シャインによる舞曲組曲集（1617年）。同一和声計画を共有する舞曲を連結する組曲形式の先駆的試み。" },
 { n:167, composer:"Giovanni Battista Draghi", dates:"(c.1640–1708)", title:"A Ground", year:"c.1690", area:"en", areaLabel:"England", type:"ground", typeLabel:"グラウンド", instr:"チェンバロ", vid:"uqJagvNPwgA", performer:"", desc:"ミラノ生まれでロンドンに定住したドラーギによるグラウンド・バス変奏。英国鍵盤音楽の伝統にイタリアの技法を融合させた移民音楽家の傑作。" },
 { n:168, composer:"Johannes Schenck", dates:"(1660–c.1712)", title:"Chaconne", year:"c.1698", area:"de", areaLabel:"Netherlands / Germany", type:"ciaccona", typeLabel:"シャコンヌ", instr:"ヴィオラ・ダ・ガンバ", vid:"qA22d8eOS9g", performer:"Hille &amp; Marthe Perl, Lee Santana (BR-Klassik)", desc:"アムステルダム出身のヴィオール名手シェンクによるシャコンヌ。ネーデルラントとドイツの反復低音様式を橋渡しし、フランス様式をガンバ音楽に昇華させた。" },

 { n:170, composer:"Giovanni Legrenzi", dates:"(1626–1690)", title:"Sonata La Cornara, Op. 2 No. 1", year:"1655", area:"it", areaLabel:"Italy", type:"ciaccona", typeLabel:"チャコーナ", instr:"ヴァイオリン・通奏低音", vid:"WUdz2CYI0Ls", performer:"", desc:"後期ヴェネツィア・バロックの巨匠レグレンツィによる名ソナタ。終曲チャコーナが特徴で、バッハもこの主題を対位法作品に引用した歴史的重要性を持つ。" },
 { n:171, composer:"Joan Cabanilles", dates:"(1644–1712)", title:"Xácara", year:"c.1680", area:"es", areaLabel:"Spain", type:"other", typeLabel:"ハカラ（スペイン舞曲）", instr:"オルガン", vid:"tGiJNL6ymDA", performer:"Arturo Barba, historic Spanish organ (Villar de Cañas)", desc:"スペイン固有の民謡的舞曲ハカラをオルガンに転写。歴史的スペイン・オルガンの音色と反復低音・特有のリズムが絡み合う、スペイン鍵盤音楽の個性を示す。" },
 { n:172, composer:"Anonymous", dates:"(c.1490)", title:"Rodrigo Martínez — Folia", year:"c.1490", area:"es", areaLabel:"Spain / Iberia", type:"folia", typeLabel:"フォリア（原初形）", instr:"ギター・リュート", vid:"SW4Eq-tbgao", performer:"Jordi Savall — La Folia 1490–1701", desc:"現存する最古のフォリア記録（c.1490）。サヴァールのアルバム「ラ・フォリア 1490–1701」の冒頭を飾る歴史的演奏。イベリア起源の反復低音文化の黎明を示す。" },

 { n:175, composer:"Christian Friedrich Witt", dates:"(c.1660–1717)", title:"Passacaglia in D minor (BWV Anh. 182)", year:"c.1700", area:"de", areaLabel:"ドイツ/オーストリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"オルガン/チェンバロ", vid:"J5kVjzXqEeI", performer:"Alexander Koschel (organ)", desc:"ザクセン＝ゴータ公国の宮廷楽長ヴィットによるニ短調のパッサカリア。長らくJ.S.バッハの作品（BWV Anh. 182）として誤って伝えられてきたことでも知られる。重厚で優れた構成を持ち、バッハの名を冠するに相応しい質を誇る作品。" },
 { n:176, composer:"Jacques-Martin Hotteterre", dates:"(1674–1763)", title:"Passacaille (Première suite Op.4)", year:"1712", area:"fr", areaLabel:"フランス", type:"passacaglia", typeLabel:"パッサカイユ", instr:"フルート二重奏（通奏低音なし）", vid:"UctSCI572BM", performer:"Marc Hantaï, Georges Barthel", parentWork:"Première suite de pièces à deux dessus, sans basse continue, Op. 4", movement:"VI. Passacaille", startTime:"0:00", endTime:"4:34", videoScope:"movement-only", desc:"オットテール《第1組曲 ロ短調 Op.4》（通奏低音なし二重奏版）終曲パッサカイユ。マルク・アンタイ＆ジョルジュ・バルテルによる優雅な演奏。固執低音的反復和声構造を二声間で担い合う。" },

 { n:180, composer:"Louis-Joseph Francœur", dates:"(1738–1804)", title:"Chaconne que j'ai faitte pour donner à mon oncle", year:"c.1760", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・ヴァイオリン＋チェンバロ", vid:"77mKzxjZDgs", performer:"Théotime Langlois de Swarte, Justin Taylor", parentWork:"", movement:"", startTime:"0:00", endTime:"5:20", videoScope:"movement-only", desc:"「叔父に贈るために作ったシャコンヌ」。フランクール一族の若い世代による個人的な佳品。テオティム・ランロワ・ド・スワルト（ヴァイオリン）＋ジュスタン・テイラー（チェンバロ）。アルファ・クラシックス2022年録音。" },
 { n:181, composer:"Jean-Pierre Guignon", dates:"(1702–1774)", title:"Chaconne (Trio Sonata in A major, Op.4 No.1)", year:"c.1737", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"フルート・ヴァイオリン・チェロ・チェンバロ", vid:"D-GCYQ-wu-E", performer:"Infusion Baroque", parentWork:"Trio Sonata in A major, Op. 4 No. 1", movement:"Chaconne (finale)", startTime:"0:00", endTime:"4:34", videoScope:"movement-only", desc:"ギニョン《トリオ・ソナタ イ長調 Op.4 第1番》終楽章シャコーナ。サボワ生まれ、ルイ15世の宮廷ヴァイオリン奏者として活躍したイタリア系フランス人作曲家の傑作。インフュージョン・バロックによるライブ演奏。" },
 { n:182, composer:"Marin Marais", dates:"(1656–1728)", title:"Passacaille (Pièces en Trio, Suite No.5 in E minor)", year:"1692", area:"fr", areaLabel:"フランス", type:"passacaglia", typeLabel:"パッサカイユ", instr:"フルート・ヴァイオリン・ヴィオラ・ダ・ガンバ・チェンバロ", vid:"GeiDyImz2NU", performer:"Byron Schenkman & Friends", parentWork:"Pièces en Trio, Suite No. 5 in E minor", movement:"Passacaille", startTime:"0:00", endTime:"4:27", videoScope:"movement-only", desc:"マレー《トリオ曲集 第5組曲 ホ短調》終曲パッサカイユ。バイロン・シェンクマン（チェンバロ）率いるアンサンブルによるKING-FMシアトルスタジオライブ。" },
 { n:183, composer:"Johann Valentin Meder", dates:"(1649–1719)", title:"Ciaconne", year:"c.1690", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"チャッコーナ", instr:"ヴァイオリン二重奏・バス・ヴィオール・チェンバロ", vid:"fwQ0pMD-VOg", performer:"Scaramella Concerts", parentWork:"", movement:"", startTime:"0:00", endTime:"4:45", videoScope:"movement-only", desc:"メーダー《チャッコーナ》独立作品。バルト海沿岸のリューベック・リガ・ケーニヒスベルクで活躍したドイツ系バロック作曲家の稀少な器楽作品。スカラメラ・コンサーツ（トロント）2008年演奏。" },

 { n:186, composer:"François Couperin", dates:"(1668–1733)", title:"Chaconne (Les Nations, L'Impériale)", year:"1726", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"ヴァイオリン2＋ヴィオル・ダ・ガンバ＋チェンバロ", vid:"R3pLgKLBCSw", performer:"Baroque chamber ensemble", parentWork:"Les Nations, 3ème Ordre 'L'Impériale'", movement:"IX. Chaconne", startTime:"0:00", endTime:"5:10", videoScope:"movement-only", desc:"クープラン《諸国民 第3番「皇帝」》終曲シャコンヌ。神聖ローマ帝国を讃えた第3番のフィナーレ。La Françoiseのシャコンヌと対をなす雄大な反復変奏曲。" },
 { n:187, composer:"Pierre Danican Philidor", dates:"(1681–1731)", title:"Chaconne (Suite No. 3, Op. 1 pour deux flûtes)", year:"c.1717", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"リコーダー二重奏（通奏低音なし）", vid:"NSsHD7dJaG0", performer:"Marine Sablonnière, Julien Martin (recorders)", parentWork:"Suite No. 3 pour deux flûtes à bec, Op. 1", movement:"Chaconne", startTime:"0:00", endTime:"3:20", videoScope:"movement-only", desc:"フィリドール一族の作曲家ピエール・ダニカン・フィリドールによる二重奏シャコンヌ。通奏低音なしで二本のリコーダーが反復低音の役割を分担。マリン・サブロニエール＆ジュリアン・マルタンによる2022年コルシカ島での演奏。" },
 { n:188, composer:"Anne Danican Philidor", dates:"(1681–1728)", title:"Le Tombeau (passacaille)", year:"1714", area:"fr", areaLabel:"フランス", type:"passacaglia", typeLabel:"パッサカイユ", instr:"フルート（ヴォイス・フルート）＋ヴィオル・ダ・ガンバ＋チェンバロ＋テオルボ", vid:"DYf7C_6N59A", performer:"Annabel Knight, Reiko Ichise, Robin Bigwood, Eligio Quinteiro", parentWork:"Deuxième livre de pièces, Paris 1714", movement:"Le Tombeau", startTime:"0:00", endTime:"6:10", videoScope:"movement-only", desc:"アンヌ・ダニカン・フィリドール《第2曲集》所収「ル・トンボー（墓碑銘）」。パッサカリア形式の追悼曲。暗鬱な低音反復上に哀愁を帯びたメロディーが展開する。コンサート・スピリチュエル創設者による傑作。" },
 { n:189, composer:"Jean-Henri D'Anglebert", dates:"(1629–1691)", title:"Chaconne Rondeau (Pièces de clavecin, Sol majeur)", year:"1689", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"2G-bV2IR8jI", performer:"Christophe Rousset (harpsichord)", parentWork:"Pièces de clavecin, Suite en sol majeur", movement:"Chaconne Rondeau", startTime:"0:00", endTime:"5:20", videoScope:"movement-only", desc:"ルイ14世の宮廷クラヴサン奏者ダングルベールによるシャコンヌ・ロンドー。1689年出版のフランス・クラヴサン音楽の頂点。クリストフ・ルセによる演奏。ロンド形式で繰り返す反復バスが洗練されたフランス様式を体現。" },
 { n:190, composer:"Nicola Matteis", dates:"(c.1650–c.1714)", title:"Diverse bizzarrie sopra la Vecchia Sarabanda o pur Ciaccona", year:"c.1685", area:"en", areaLabel:"イギリス", type:"ciaccona", typeLabel:"チャッコーナ", instr:"ヴァイオリン+通奏低音", vid:"k4sE0vX34zQ", performer:"Ground Floor baroque ensemble", desc:"マッテイス《ヴァイオリンのためのエア》所収の「旧サラバンド——チャッコーナ変奏集」。固執低音上に変幻自在の変奏が連なる。同曲集の「スコットランド風グラウンド」（n:130）と並ぶ傑作。ナポリとロンドンを結ぶ反復低音音楽の架け橋。" },

 { n:192, composer:"Marin Marais", dates:"(1656–1728)", title:"Chaconne in A Major (Pièces de viole, Livre V, Suite No. 2)", year:"1725", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"ヴィオル・ダ・ガンバ2＋チェンバロ", vid:"HJuR9WJ1iRY", performer:"Elisabeth Reed, Cassandra Luckhardt, Katherine Heater (Voices of Music)", parentWork:"Pièces de viole, Cinquième Livre, Suite No. 2 en la majeur", movement:"No. 31, Chaconne", startTime:"0:00", videoScope:"movement-only", desc:"マレの第5ヴィオル曲集（1725）第2組曲の第31曲シャコンヌ。イ長調の明るく流麗な変奏曲。ヴォイシズ・オブ・ミュージックによる単独楽章録音。エリザベス・リード（ヴィオル）ら3名。" },
 { n:193, composer:"Marin Marais", dates:"(1656–1728)", title:"Chaconne en sol majeur (Pièces de viole, Livre V, Suite No. 6)", year:"1725", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"ヴィオル・ダ・ガンバ2＋テオルボ＋チェンバロ", vid:"9f7ObItVRDc", performer:"Fuoco E Cenere, dir. Jay Bernfeld", parentWork:"Pièces de viole, Cinquième Livre, Suite No. 6 en sol majeur", movement:"No. 83, Chaconne", startTime:"0:00", videoScope:"movement-only", desc:"マレの第5ヴィオル曲集（1725）第6組曲の第83曲シャコンヌ。ト長調の堂々たる変奏曲で、フランス・バロック後期のヴィオル芸術の粋。フオーコ・エ・チェネレによる単独楽章録音。" },
 { n:194, composer:"Marin Marais", dates:"(1656–1728)", title:"Chaconne en ré majeur (Pièces de viole, Livre I, Suite No. 2)", year:"1686", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"ヴィオル・ダ・ガンバ＋チェンバロ", vid:"6pjkBZgaW6E", performer:"Julia Karpeta (viola da gamba), Maurycy Raczyński (harpsichord)", parentWork:"Pièces de viole, Premier Livre (1686), Suite No. 2 en ré majeur", movement:"Chaconne", startTime:"0:00", videoScope:"movement-only", desc:"マレの第1ヴィオル曲集（1686）第2組曲のシャコンヌ。ヴィオル音楽の草創期における変奏技法の萌芽。ユリア・カルペタ（ヴィオル）とマウリツィ・ラチンスキ（チェンバロ）による2024年収録。" },
 { n:195, composer:"Marin Marais", dates:"(1656–1728)", title:"Chaconne en fa majeur (Pièces de viole, Livre III, Suite No. 3)", year:"1711", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バス・ヴィオール＋通奏低音", vid:"T5ThU-bgw1Q", performer:"Jérôme Hantaï (bass viol)", parentWork:"Pièces de viole, Troisième Livre (1711), Suite No. 3 en fa majeur", movement:"No. 38 (XIII), Chaconne", startTime:"0:00", videoScope:"movement-only", desc:"マレの第3ヴィオル曲集（1711）第3組曲第38曲シャコンヌ。ヘ長調の穏やかな変奏曲。ジェローム・アンタイによるワーナー・クラシックス録音（1998年）の自動生成配信。" },
 { n:196, composer:"Marin Marais", dates:"(1656–1728)", title:"Chaconne en ré majeur (Pièces de viole, Livre III, Suite No. 4)", year:"1711", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バス・ヴィオール＋通奏低音", vid:"OJNnll1uTUo", performer:"Ernst Stolz (viola da gamba)", parentWork:"Pièces de viole, Troisième Livre (1711), Suite No. 4 en ré majeur", movement:"No. 56 (XVII), Chaconne", startTime:"0:00", videoScope:"movement-only", desc:"マレの第3ヴィオル曲集（1711）第4組曲第56曲シャコンヌ。ニ長調の堂々たる変奏曲。エルンスト・シュトルツ（ヴィオル）による単独楽章録音。" },
 { n:197, composer:"Johann Mattheson", dates:"(1681–1764)", title:"Chaconne (Sonata Op. 1 No. 3 for three recorders)", year:"c.1708", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"シャコンヌ", instr:"リコーダー3本（ソプラノ・アルト・テナー）", vid:"lu99wSx8fzY", performer:"Horacio Franco (recorders)", parentWork:"12 Sonatas for Three Recorders, Op. 1, No. 3 in G minor", movement:"Chaconne (finale)", startTime:"0:00", videoScope:"movement-only", desc:"ハンブルクの多才な音楽家マッテゾンによるリコーダー三重奏ソナタ第3番（ト短調）の終曲シャコンヌ。3本のリコーダーがユニゾンで奏でる切々とした旋律が特徴的な傑作。ホラシオ・フランコによる単独楽章録音。" },
 { n:198, composer:"Michel Corrette", dates:"(1707–1795)", title:"Chaconne pour pardessus de viole seul", year:"c.1738", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"パルデシュ・ド・ヴィオール独奏", vid:"yIxtLOaKYhA", performer:"Ernst Stolz (pardessus de viole)", parentWork:"Pièces pour le pardessus de viole", movement:"Chaconne", startTime:"0:00", videoScope:"movement-only", desc:"多産な教育者・作曲家コレットによるパルデシュ・ド・ヴィオール独奏のシャコンヌ。高音ヴィオールのための珍しいレパートリー。エルンスト・シュトルツによる単独楽章録音。" },
 { n:199, composer:"Jean-Marie Leclair", dates:"(1697–1764)", title:"Chaconne (Sonata en sol majeur, Op. 5 No. 12)", year:"1734", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・ヴァイオリン＋チェンバロ", vid:"kNQYt8ldfg4", performer:"Rachell Ellen Wong (violin), Byron Schenkman (harpsichord)", parentWork:"6 Sonatas for Violin and Continuo, Op. 5, No. 12 in G major", movement:"Chaconne (finale)", startTime:"0:00", videoScope:"movement-only", desc:"フランス・ヴァイオリン楽派を代表するルクレールのソナタOp.5第12番（ト長調）の終曲シャコンヌ。イタリア様式とフランス趣味を巧みに融合した大規模変奏曲。ラシェル・エレン・ウォンとバイロン・シェンクマンによる2020年録音。" },
 { n:200, composer:"Jean-Marie Leclair", dates:"(1697–1764)", title:"Chaconne (Deuxième récréation de musique, Op. 8 No. 2)", year:"c.1737", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・ヴァイオリン2＋通奏低音", vid:"Var-0VzU1Hg", performer:"Les Ramoneurs", parentWork:"Deuxième récréation de musique, Op. 8", movement:"Chaconne", startTime:"0:00", videoScope:"movement-only", desc:"ルクレールの「音楽の娯楽」第2集（Op.8）のシャコンヌ。ヴァイオリン二重奏と通奏低音による精巧な変奏曲。アンサンブル・レ・ラモヌールによる2014年EMAバロック演奏コンクール出演録音。" },
 { n:201, composer:"Jacques Duphly", dates:"(1715–1789)", title:"Chaconne (Troisième Livre de pièces de clavecin)", year:"1756", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"_NiMxx37wmI", performer:"Jean Patrice Brosse (harpsichord)", parentWork:"Troisième Livre de pièces de clavecin (1756)", movement:"Chaconne", startTime:"0:00", videoScope:"movement-only", desc:"フランス・ロココ期のチェンバロ音楽を代表するデュフリの傑作シャコンヌ。華麗な変奏と重厚な低音主題が交差する大規模変奏曲で、フランス・チェンバロ音楽の掉尾を飾る名品。ジャン・パトリス・ブロスによる演奏。" },
 { n:202, composer:"Louis Marchand", dates:"(1669–1732)", title:"Chaconne (Pièces de clavecin, Premier Livre)", year:"1702", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"O_HVxvHam5Y", performer:"Patricia Robaina (harpsichord)", parentWork:"Pièces de clavecin, Premier Livre (1702)", movement:"Chaconne", startTime:"0:00", videoScope:"movement-only", desc:"バッハとの伝説的な鍵盤対決で名高いフランスのヴィルトゥオーゾ、マルシャンのチェンバロ曲集第1巻（1702）のシャコンヌ。フランス・バロック鍵盤音楽の精髄。パトリシア・ロバイナによる単独楽章録音。" },
 { n:203, composer:"Reinhard Keiser", dates:"(1674–1739)", title:"Chaconne en rondeau 'Betrübter Geist' (Hercules und Hebe)", year:"c.1699", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"シャコンヌ", instr:"ソプラノ＋バロック管弦楽", vid:"AzxIEDKoMH4", performer:"Yeree Suh (soprano), Elbipolis Barockorchester Hamburg", parentWork:"Hercules und Hebe (opera/suite)", movement:"Chaconne en rondeau 'Betrübter Geist'", startTime:"0:00", videoScope:"movement-only", desc:"ハンブルク・オペラ・アム・ガンゼマルクトの主要作曲家カイザーによるオペラ「ヘルクレスとヘーベ」のシャコンヌ・アリア。「悲しめる魂」を題材に、ロンドー形式で展開する通奏低音変奏曲。スー・イェレ（ソプラノ）と、エルビポリス・バロック管弦楽団による演奏。" },
 { n:204, composer:"Antonio Soler", dates:"(1729–1783)", title:"Fandango en ré mineur (R.146)", year:"c.1770", area:"es", areaLabel:"スペイン", type:"other", typeLabel:"ファンダンゴ", instr:"チェンバロ", vid:"LMvgGUGn1-E", performer:"Rafael Puyana (harpsichord, Hass 1740)", desc:"スペインの修道士・作曲家ソレールによる鍵盤楽器のための大規模ファンダンゴ。2小節のオスティナート和声型（イ長調とト短調の往復）を全曲維持しながら461小節にわたって展開する。スペイン民族音楽とバロック様式の融合。ラファエル・プヤナによる歴史的名演（1740年製ハス・チェンバロ）。" },
 { n:205, composer:"Thomas Tomkins", dates:"(1572–1656)", title:"Ground in D minor", year:"c.1640", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンドバス", instr:"チェンバロ", vid:"VQNDEzNqlE0", performer:"Lydia Maria Blank (harpsichord)", desc:"オルガン奏者・多声音楽の大家トムキンズによるニ短調のグラウンド。繰り返す低音動機が内声にも転移する対位法的な変奏技法が特徴。リディア・マリア・ブランクによる2022年録音。" },
 { n:206, composer:"Giovanni Picchi", dates:"(c.1571–c.1643)", title:"Pass'e mezzo antico (Balli d'arpicordo)", year:"1619", area:"it", areaLabel:"イタリア", type:"other", typeLabel:"パッサメッツォ", instr:"チェンバロ", vid:"2iiOVRvqZrM", performer:"Korneel Bernolet (harpsichord)", desc:"ヴェネツィアの鍵盤奏者ピッキが1619年に出版した舞曲集『バッリ・ダルピコルド』より。パッサメッツォ・アンティコ（古い道を歩む）は16世紀イタリアの最重要オスティナート・バス型の一つ。通奏低音音楽の直接的先駆。コルネール・ベルノレによる2020年録音。" },
 { n:207, composer:"Marin Marais", dates:"(1656–1728)", title:"Chaconne en sol majeur No.82 (Pièces de viole, Livre I)", year:"1689", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・ヴァイオリン＋フルート＋ヴィオル・ダ・ガンバ＋通奏低音", vid:"YqlGTKG8v5s", performer:"New Comma Baroque (Matthew C. Cataldi, Leighann Daihl Ragusa, Phillip W. Serna, Emily J. Katayama)", parentWork:"Pièces de viole, Premier Livre (1689)", movement:"No. 82, Chaconne en sol majeur", startTime:"0:00", videoScope:"movement-only", desc:"マレの第1ヴィオル曲集（1689）第82曲シャコンヌ（ト長調）。初期マレの対位法的変奏技法が光る作品で、ヴァイオリン・フルート・ヴィオルの混成アンサンブルで演奏。ニュー・コンマ・バロックによる2012年録音。" },
 { n:208, composer:"Marin Marais", dates:"(1656–1728)", title:"Chaconne en rondeau No.82 en sol (Pièces de viole, Livre II)", year:"1701", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"ヴィオル・ダ・ガンバ2＋チェンバロ＋テオルボ＋バロック・ギター＋パーカッション", vid:"6VW60E3T9gM", performer:"Paolo Pandolfo, Alba Fresno, Mitzi Meyerson, Thomas Boysen, Juan Carlos de Mulder, Pedro Estevan", parentWork:"Pièces de viole, Deuxième Livre (1701), Suite en sol majeur", movement:"No. 82, Chaconne en rondeau", startTime:"0:00", videoScope:"movement-only", desc:"マレの第2ヴィオル曲集（1701）ト長調組曲の第82曲シャコンヌ・アン・ロンドー。二重ヴィオルと豊かな通奏低音群による充実した変奏曲。ヴィオル界の巨匠パオロ・パンドルフォらによる演奏。" },
 { n:209, composer:"Monsieur de Sainte-Colombe", dates:"(fl.1658–c.1700)", title:"Chaconne en ré mineur", year:"c.1680", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"ヴィオル・ダ・ガンバ独奏", vid:"A9Aba5A9dj4", performer:"François Joubert-Caillet (bass viol)", startTime:"0:00", videoScope:"movement-only", desc:"マレの師として名高いサント＝コロンブによるニ短調のシャコンヌ。フランス・ヴィオル音楽の代表的な作品で、低音の反復型上に複雑な変奏が積み重なる孤高の名作。フランスの名ガンバ奏者フランソワ・ジュベール＝カイエによる2022年ゲント録音。" },
 { n:210, composer:"Georg Philipp Telemann", dates:"(1681–1767)", title:"Chaconne des Lilliputiens (Gulliver Suite, TWV 40:107)", year:"1728", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"シャコンヌ", instr:"2本のヴァイオリン", vid:"uAeSyc7JqR4", performer:"Duo Gelland", parentWork:"Gulliver Suite, TWV 40:107", movement:"Chaconne des Lilliputiens", startTime:"0:00", videoScope:"movement-only", desc:"テレマンによる「ガリヴァー旅行記」組曲（1728）の一楽章「リリパット人のシャコンヌ」。極めて短く均整のとれた反復型が、小人国の機械的で整然とした動きをユーモラスに表現する。デュオ・ゲラントによるヴァイオリン二重奏演奏。" },
 { n:211, composer:"Johann Bernhard Bach", dates:"(1676–1749)", title:"Ciaconna in G-Dur", year:"c.1720", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"チャコーナ", instr:"チェンバロ", vid:"jw_9YDtUMEM", performer:"Andreas Zappe (harpsichord, after Giusti, meantone a=415)", startTime:"0:00", videoScope:"movement-only", desc:"J.S.バッハのいとこ、ヨハン・ベルンハルト・バッハによるト調のチャコーナ。変奏楽曲の名手バッハ一族の血筋を伝える鍵盤変奏曲で、オスティナート低音上の多彩な和声変奏が展開する。アンドレアス・ツァッペによるグスティ様式チェンバロ演奏。" },
 { n:212, composer:"Johann Bernhard Bach", dates:"(1676–1749)", title:"Chacona in B-flat major", year:"c.1720", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"チャコーナ", instr:"チェンバロ", vid:"N-NhunaHX_U", performer:"Andrés Alberto Gómez (clave)", startTime:"0:00", videoScope:"movement-only", desc:"ヨハン・ベルンハルト・バッハによる変ロ長調のチャコーナ。繰り返す低音型と豊かな和声変奏が渾然一体となり、バロック変奏曲の醍醐味を伝える。マドリードのフアン・マルチ財団「バッハの系譜」コンサートシリーズ（2013年）より、アンドレス・アルベルト・ゴメスによる演奏。" },
 { n:213, composer:"Georg Friedrich Händel", dates:"(1685–1759)", title:"Chaconne mit 49 Variationen in C-Dur (HWV 484)", year:"c.1705", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"wQ5eAeNU4Ck", performer:"Fernando De Luca (harpsichord)", startTime:"0:00", videoScope:"movement-only", desc:"ヘンデルによる49変奏付きシャコンヌ（ハ長調、HWV 484、c.1705）。約29分に及ぶ大規模変奏曲で、ヘンデルの鍵盤音楽における代表作のひとつ。イタリア・ドイツ様式を融合した壮大な変奏技法が展開する。フェルナンド・デ・ルカによる2023年録音（Da Vinci Classics）。" },
 { n:214, composer:"Georg Friedrich Händel", dates:"(1685–1759)", title:"Chaconne in F-Dur (HWV 485)", year:"c.1705", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"NE8XHTft5Zs", performer:"Roberto Loreggian (harpsichord)", startTime:"0:00", videoScope:"movement-only", desc:"ヘンデルによる独立したシャコンヌ（ヘ長調、HWV 485、c.1705）。初期鍵盤作品の一つで、明快な和声と優雅な変奏が特徴の小品。ロベルト・ロレッジャンによる「ヘンデル：鍵盤音楽全集」（Brilliant Classics）からの録音。" },
 { n:215, composer:"Georg Friedrich Händel", dates:"(1685–1759)", title:"Chaconne in g-Moll (HWV 486)", year:"c.1705", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"DR0_RcRcbIo", performer:"Roberto Loreggian (harpsichord)", startTime:"0:00", videoScope:"movement-only", desc:"ヘンデルによる独立したシャコンヌ（ト短調、HWV 486、c.1705）。短調の哀愁を帯びた変奏技法が際立つ小品で、同時期の長調シャコンヌ群と好対照をなす。ロベルト・ロレッジャンによる「ヘンデル：鍵盤音楽全集」（Brilliant Classics）からの録音。" },
 { n:216, composer:"Gottlieb Muffat", dates:"(1690–1770)", title:"Ciaconna in G-Dur No.7 (Componimenti Musicali per il Cembalo, MC A19)", year:"c.1739", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"チャコーナ", instr:"チェンバロ", vid:"3AeM142NLn8", performer:"Naoko Akutagawa (harpsichord, after Ruckers)", parentWork:"Componimenti Musicali per il Cembalo (c.1739)", movement:"Ciaconna No. 7 in G major (MC A19)", startTime:"0:00", videoScope:"movement-only", desc:"父ゲオルク・ムッファトの子、ゴットリープ・ムッファトがハプスブルク皇帝カール6世に献呈した『コンポニメンティ・ムジカリ』（c.1739）のチャコーナ第7番（ト長調、MC A19）。父譲りの対位法的技巧とイタリア・フランス混成様式の洗練を示す大規模変奏曲。直子芥川によるルッカース様式チェンバロ演奏。" },
 { n:217, composer:"Jacques Aubert", dates:"(1689–1753)", title:"Chaconne en la mineur pour deux violons", year:"c.1725", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・ヴァイオリン2", vid:"CqRCL3QqKcU", performer:"Innovation Duo (Anna Savytska, Jakub Dzialak)", startTime:"0:00", videoScope:"movement-only", desc:"フランスのヴァイオリニスト・作曲家オベールによる2本のヴァイオリンのためのイ短調シャコンヌ。イタリア演奏技法とフランスの音楽様式を巧みに融合させたフランス・バロックの隠れた傑作。30以上の国際賞受賞歴を持つイノヴェーション・デュオによる2024年録音。" },
 { n:218, composer:"Niccolò Jommelli", dates:"(1714–1774)", title:"Ciaccona per orchestra", year:"c.1755", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"バロック管弦楽", vid:"aRvHzlPr0Kw", performer:"Cappella Neapolitana, Antonio Florio (dir.)", startTime:"0:00", videoScope:"movement-only", desc:"ナポリ楽派の巨匠ジョンメッリによる管弦楽のためのチャッコーナ。後期バロックのイタリア様式で書かれた充実した変奏曲で、古典派移行期の語法も兼ね備える。アントニオ・フロリオ指揮カペラ・ナポリターナによる2005年モンペリエ公演録音。" },
 { n:219, composer:"Nicolas Lebègue", dates:"(1631–1702)", title:"Chaconne en fa majeur (Pièces de Clavessin, Livre II, 1687)", year:"1687", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"MJlF_lJF9a0", performer:"Leonard Byun (harpsichord, after Franco-Flemish)", parentWork:"Pièces de Clavessin, Livre II (1687)", movement:"Chaconne en fa majeur", startTime:"43:35", videoScope:"full-work-with-timestamp", desc:"ルイ14世の王室礼拝堂オルガニスト、ルベーグの『クラヴサン曲集第2巻』（1687）収録のヘ長調シャコンヌ。フランス・バロック鍵盤音楽の優雅な変奏語法の典型。ミニ・リサイタル（パッヘルベル6組曲に続くアンコール最終曲）にてレオナルド・ビュンが演奏。" },
 { n:220, composer:"Giovanni Battista Ferrini", dates:"(1601–1674)", title:"Ciaccona in fa maggiore", year:"c.1650", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"チェンバロ", vid:"N1vy3jH4D0E", performer:"Leonard Byun (harpsichord, after Vater 1738)", startTime:"0:00", videoScope:"movement-only", desc:"フレスコバルディの影響圏にあるローマのチェンバロ奏者フェッリーニによるヘ長調チャッコーナ。未出版のまま手稿として伝承された17世紀イタリア鍵盤音楽の知られざる逸品。レオナルド・ビュンによるヴァーテル様式チェンバロ演奏（クォーター・コンマ平均律、A=412Hz）。" },
 { n:221, composer:"John Blow", dates:"(1649–1708)", title:"Chaconne pour clavecin (1687)", year:"1687", area:"en", areaLabel:"イングランド", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"4o20CaUp7AA", performer:"Timothy Roberts (harpsichord, Patrick Chevalier)", startTime:"0:00", videoScope:"movement-only", desc:"パーセルの師であるイングランドの大家ジョン・ブローによる1687年のチェンバロのためのシャコンヌ。英国バロック鍵盤音楽の代表作のひとつとされる作品で、反復低音上の変奏美が際立つ。ティモシー・ロバーツによるパトリック・シュヴァリエ製チェンバロ演奏。" },
 { n:222, composer:"Christoph Graupner", dates:"(1683–1760)", title:"Chaconne (Partita GWV 824)", year:"c.1720", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"チャコーナ", instr:"チェンバロ", vid:"kFJlNJ6W6-g", performer:"Leonard Byun (harpsichord, Dr.Claveciniste)", parentWork:"Partita GWV 824", movement:"Chaconne", startTime:"0:00", videoScope:"movement-only", desc:"ヘンデルの同時代人でダルムシュタット宮廷楽長を務めたグラウプナーによるチャコーナ（パルティータGWV 824）。オスティナート低音上の精緻な変奏を約10分にわたって展開する大規模鍵盤変奏曲。ドクター・クラヴサニスト（レオナルド・ビュン）によるチェンバロ演奏（2020年）。" },
 { n:223, composer:"Christoph Graupner", dates:"(1683–1760)", title:"Chaconne VI (Partita in C-Dur, GWV 127)", year:"c.1720", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"チャコーナ", instr:"チェンバロ", vid:"Zw98g7UOMqs", performer:"Fernando De Luca (harpsichord)", parentWork:"Partita in C major, GWV 127", movement:"VI. Chaconne", startTime:"0:00", videoScope:"movement-only", desc:"グラウプナーのハ長調パルティータ（GWV 127）第6楽章チャコーナ。序曲・エール・ルール・メヌエット・エール・シャコーナ・アントレの7楽章構成の核心をなす変奏曲。フェルナンド・デ・ルカによる「グラウプナー：チェンバロ音楽全集」（Brilliant Classics、2021年）からの録音。" },
 { n:224, composer:"Evaristo Felice Dall'Abaco", dates:"(1675–1742)", title:"III. Ciaconna (Concerto a più istrumenti, Op.5 No.6, D-Dur)", year:"c.1719", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"バロック合奏", vid:"qWQidbhD9aM", performer:"Bremer Barockorchester (dir. Néstor Fabián Cortés Garzón)", parentWork:"Concerto a più istrumenti, Op.5 No.6 in D major", movement:"III. Ciaconna", startTime:"0:00", videoScope:"movement-only", desc:"ヴェネツィア生まれでミュンヘン宮廷に仕えたダッラーバコによる管弦楽コンチェルト（Op.5 No.6）の終楽章チャッコーナ（ニ長調）。イタリアの旋律美とドイツの対位法を融合したバイエルン宮廷バロックの傑作。動画は第3楽章のみの独立映像。" },
 { n:225, composer:"Francesco Geminiani", dates:"(1687–1762)", title:"Chaconne sopra la Sarabanda (Concerto Grosso in D minor, Op.5 No.7, H.181)", year:"c.1726", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・ヴァイオリン", vid:"l5fK4VCZUJw", performer:"Jorge Jiménez (violin, Giovine Orchestra Genovese 2019)", startTime:"0:00", videoScope:"movement-only", desc:"師コレッリのヴァイオリン・ソナタOp.5 No.7のサラバンドを主題とするシャコンヌで、ジェミニャーニが協奏曲大編成版（H.181）に組み込んだ変奏曲。コレッリ様式の精緻な対位法変奏が展開する。ジェノヴァ＝ジョヴィーネ・オーケストラ主催「フォリアと創意の間の17・18世紀音楽」コンサートシリーズ（2019年）でのホルヘ・ヒメネスによる独奏。" },
 { n:226, composer:"Johann Kuhnau", dates:"(1660–1722)", title:"Ciaconna (Frische Clavier-Früchte, Sonata No.6 in B-flat, I/V)", year:"1696", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"チャコーナ", instr:"チェンバロ", vid:"8aLxhG50IUs", performer:"John Butt (harpsichord)", parentWork:"Frische Clavier-Früchte, Sonata No.6 in B-flat major (1696)", movement:"I. Ciaconna / V. Ciaconne da capo (arch form)", startTime:"0:00", videoScope:"full-work-with-timestamp", desc:"J.S.バッハの前任者として知られるライプツィヒのトーマスカントル、クーナウによるチェンバロ・ソナタ集「新鮮なクラヴィア曲集」（1696）第6番変ロ長調。第1楽章チャコーナから始まり第5楽章チャコーナ・ダ・カポで終わるアーチ形式の傑作。バッハの鍵盤様式の前史を示す重要作品。ジョン・バット（チェンバロ）による歴史的録音。" },
 { n:227, composer:"Luigi Boccherini", dates:"(1743–1805)", title:"III. Allegro assai con moto / Chaconne (Symphonie 'La casa del diavolo', Op.12 No.4, G.506)", year:"1771", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"シャコンヌ", instr:"弦楽合奏", vid:"bvesTgZxnws", performer:"Le Concert de la Loge (Julien Chauvin, dir., 2016)", parentWork:"Symphonie 'La casa del diavolo', Op.12 No.4 in D minor, G.506 (1771)", movement:"III. Allegro assai con moto (Chaconne représentant l'Enfer)", startTime:"0:00", videoScope:"movement-only", desc:"「悪魔の家」の異名で知られるボッケリーニの交響曲（Op.12 No.4、ニ短調、G.506）終楽章。グルックのドン・ジョヴァンニ・バレエを模した「地獄を表すシャコンヌ」という自注を持つ。反復する低音型上に弦楽の緊張が高まる劇的変奏曲。ジュリアン・ショーヴァン指揮ル・コンセール・ド・ラ・ロージュによるドーヴィル音楽祭（2016年）でのライヴ演奏。" },
 { n:228, composer:"Christoph Willibald Gluck", dates:"(1714–1787)", title:"Ballet VII. Chaconne (Orfeo ed Euridice, Wq.30)", year:"1762", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"シャコンヌ", instr:"管弦楽", vid:"fZhlJycA7JE", performer:"Les Musiciens du Louvre (Marc Minkowski, dir., DG 2004)", parentWork:"Orfeo ed Euridice, Wq.30 (1762)", movement:"Ballet, VII. Chaconne", startTime:"0:00", videoScope:"movement-only", desc:"オペラ改革者グルックの代表作「オルフェオとエウリディーチェ」（1762年ウィーン初演）のバレエ音楽中の第7曲シャコンヌ。古典主義的な明快さと深みを兼ね備えた反復低音変奏曲で、後代のベートーヴェンやワーグナーに多大な影響を与えた。マルク・ミンコフスキ指揮レ・ミュジシャン・デュ・ルーヴルによるドイツ・グラモフォン録音（2004年）。" },
 { n:229, composer:"Joseph Bodin de Boismortier", dates:"(1689–1755)", title:"Chaconne in A major (9 Petites Sonates et Chaconne, Op.66)", year:"1737", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・ファゴット2+チェンバロ", vid:"rPwknJez0HE", performer:"Elione Medeiros, Eduardo Antonello (baroque bassoons, harpsichord)", parentWork:"9 Petites Sonates suivies d'une Chaconne, Op.66 (1737)", movement:"Chaconne (final piece, following 9 sonatas)", startTime:"0:00", videoScope:"movement-only", desc:"フランス・バロック多作家ボワモルティエによる「9つの小ソナタとシャコンヌ」（Op.66、1737年）の掉尾を飾るイ長調シャコンヌ。2本のファゴット（またはチェロ、ヴィオール）のための対話変奏曲で、2声部が絡み合う独特の編成が魅力。エリオーネ・メデイロスとエドゥアルド・アントネロによるバロック・ファゴットとチェンバロの演奏。" },
 { n:230, composer:"Nicolas Siret", dates:"(1663–1754)", title:"Chaconne in A minor (Pièces de Clavessin, Livre 2, Suite 3)", year:"1719", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"JelDHptq8v4", performer:"(harpsichord after Couchet/Ruckers 1679, Smithsonian Institution)", parentWork:"Pièces de Clavessin, Livre 2 (1719), Suite 3 in A minor", movement:"Chaconne", startTime:"0:00", videoScope:"movement-only", desc:"トロワの大聖堂オルガニストとして91歳まで生きたシレのクラヴサン曲集第2巻（1719）第3組曲（イ短調）のシャコンヌ。F.クープランと同時代の洗練されたフランス鍵盤語法による変奏曲。スミソニアン研究所蔵のクシェ＝リュッカース1679年型複製チェンバロによる演奏。" },
 { n:231, composer:"François d'Agincourt", dates:"(1684–1758)", title:"Chaconne 'La Sonning' (Pièces de clavecin, 1733)", year:"1733", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"Mgxtj9YQ6ho", performer:"Andreas Zappe (harpsichord after Dulcken by Cornelis Bom, a=392Hz)", parentWork:"Pièces de clavecin (1733)", movement:"Chaconne: La Sonning", startTime:"0:00", videoScope:"movement-only", desc:"ルーアン大聖堂とヴェルサイユ宮廷礼拝堂に仕えたダジャンクールによるクラヴサン曲集（1733）収録の「ソニング」と題するシャコンヌ。洗練されたフランス・ロココ鍵盤変奏曲の典型。アンドレアス・ツァッペによるダルクン様式チェンバロ（a=392Hz）演奏。" },
 { n:232, composer:"Jean-Nicolas Geoffroy", dates:"(1633–1694)", title:"Chaconne en ré mineur (Livre des pièces de clavecin)", year:"c.1680", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ＋テオルボ", vid:"xKa1RZ3BoWE", performer:"Aurélien Delage (harpsichord), Thomas Dunford (lute)", startTime:"0:00", videoScope:"movement-only", desc:"パリの鍵盤音楽家ジョフロワは生涯に18曲ものシャコンヌを作曲した——17・18世紀で最多の作曲家の一人。本手稿曲集（未出版のまま伝承）収録のニ短調シャコンヌは反復する低音型上に多彩な変奏が積み重なる。オーレリアン・ドラージュ（チェンバロ）とトーマス・ダンフォード（リュート）による特別二重奏。" },
 { n:233, composer:"Georg Muffat", dates:"(1653–1704)", title:"V. Grave – Ciacona (Concerto Grosso XII 'Propitia Sydera')", year:"1701", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"チャコーナ", instr:"弦楽合奏", vid:"SpVQT-bdqD0", performer:"Bremer Barockorchester (2018)", parentWork:"Concerto Grosso XII 'Propitia Sydera' in G major (Armonico Tributo / Auserlesene Instrumental-Music, 1701)", movement:"V. Grave – Ciacona", startTime:"0:00", videoScope:"movement-only", desc:"ムッファトの協奏曲集「調和への貢物」（1701年）第12番「プロピティア・シデラ」の終楽章チャコーナ（ト長調）。全5楽章（ソナタ・グラーヴェ、アレグロ、アリア、ガヴォッタ、グラーヴェ＝チャコーナ）の掉尾を飾る反復低音変奏曲で、コレッリ様式を熟知したムッファトが南独カトリック宮廷語法で昇華した傑作。ブレーメン・バロック管弦楽団による2018年録音。" },
 { n:234, composer:"Nicolas de Merville", dates:"(c.1600–after 1643)", title:"Ciacona (ms. Buenos Aires, Biblioteca nacional)", year:"c.1635", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"チャコーナ", instr:"バロック・リュート", vid:"CzS5N-H9FJE", performer:"(baroque lute)", startTime:"0:00", videoScope:"movement-only", desc:"パリの王室リュート奏者メルヴィルによる独奏チャコーナ。ルイ13世の「ロワ・ミュジシャン」として1625年から1644年にかけて文書に登場する初期フランス・バロック・リュートの重要作曲家。1636年にメルセンヌが存命の主要リュート奏者として名を挙げた名手の作。ブエノスアイレス国立図書館所蔵手稿譜（RA-BAn Ms. 236）に伝わる知られざる反復低音変奏曲。18のシャコンヌを残したジョフロワと並ぶ初期フランス・チャコーナの貴重な遺産。" },
 { n:235, composer:"Ennemond Gaultier", dates:"(1575–1651)", title:"La Cascade (Chaconne in F major)", year:"c.1640", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・リュート", vid:"r-g7WYCNAyo", performer:"Miguel Serdoura (11-course baroque lute, Brilliant Classics 2008)", startTime:"0:00", videoScope:"movement-only", desc:"「ヴュー・ゴーティエ（老ゴーティエ）」として知られるフランス最初期のバロック・リュートの巨匠エネモン・ゴーティエによるシャコンヌ「ラ・カスカード（滝）」（ヘ長調）。リヨンからパリへ移り、ルイ13世・ルイ14世の宮廷で活躍した最初期フランス・バロック・リュートの確立者。従弟ドゥニ・ゴーティエや後のド・ヴィゼーらに受け継がれたフランス・リュート語法の源流。ミゲル・セルドゥラによる11コース・バロック・リュート演奏（Brilliant Classics 2008年）。" },
 { n:236, composer:"Charles Mouton", dates:"(c.1626–c.1699)", title:"La belle Astrée (Chaconne, ms. Praha Kk 80)", year:"c.1670", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・リュート", vid:"fT9o9YEm2N8", performer:"Arto Wikla (11-course baroque lute, Lars Jönsson 1993)", startTime:"0:00", videoScope:"movement-only", desc:"ドゥニ・ゴーティエの弟子であり17世紀フランス・バロック・リュートの重要作曲家シャルル・ムートンによるシャコンヌ「美しいアストレー」。プラハ手稿譜（Kk 80）に伝わる優美な反復低音変奏曲で、ゴーティエ様式を継承しつつ独自の歌心を示す。アルト・ウィクラによる11コース・バロック・リュート（ラルス・ヨンソン1993年製作）演奏。" },
 { n:237, composer:"Charles Mouton", dates:"(c.1626–c.1699)", title:"Passacaille Le doux Hymen", year:"c.1670", area:"fr", areaLabel:"フランス", type:"passacaglia", typeLabel:"パッサカイユ", instr:"バロック・リュート", vid:"1GEidywiCQA", performer:"Francesca Torelli (baroque lute)", startTime:"0:00", videoScope:"movement-only", desc:"フランス・バロック・リュートの名手ムートンによるパッサカイユ「甘美なヒュメン（婚礼）」。反復する3拍子の低音型上に優雅な変奏が積み重なるフランス宮廷リュートの精華。フランチェスカ・トレッリによるバロック・リュート演奏。" },
 { n:238, composer:"Jacques Gallot", dates:"(fl.c.1650–d.c.1685)", title:"Chaconne 'Le Doge de Venise'", year:"c.1670", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"IQSuc-imQ5c", performer:"Johanne Couture (harpsichord; originally for lute)", startTime:"0:00", videoScope:"movement-only", desc:"「ヴェネツィアの総督」と題するガロのシャコンヌ。元来リュートのために書かれた作品のチェンバロ編曲版。パリで活躍したガロ一族の代表的作品で、南欧的な華やかさと変奏の多彩さを示す。ジョアンヌ・クトゥールによるチェンバロ演奏。" },
 { n:239, composer:"Jacques Gallot", dates:"(fl.c.1650–d.c.1685)", title:"L'espagnolette (Passacaille, D-Lem ms. II.6.14)", year:"c.1670", area:"fr", areaLabel:"フランス", type:"passacaglia", typeLabel:"パッサカイユ", instr:"バロック・リュート", vid:"YtvUqcITgVA", performer:"Arto Wikla (11-course baroque lute, Lars Jönsson 1993)", startTime:"0:00", videoScope:"movement-only", desc:"ガロによるパッサカイユ「エスパニョレット（小スペイン風）」。ライプツィヒ音楽図書館所蔵手稿譜（D-Lem ms. II.6.14）に伝わる作品で、スペイン風の力強い低音型を基盤とした3拍子の変奏曲。アルト・ウィクラによる11コース・バロック・リュート演奏。" },
 { n:240, composer:"Jacques Gallot", dates:"(fl.c.1650–d.c.1685)", title:"Les Folies d'Espagne in A minor", year:"c.1680", area:"fr", areaLabel:"フランス", type:"folia", typeLabel:"フォリア", instr:"バロック・リュート", vid:"TVBJqQUGGR8", performer:"Miguel Serdoura (11-course baroque lute, Brilliant Classics 2008)", startTime:"0:00", videoScope:"movement-only", desc:"ガロによる「スペインのフォリア」（イ短調）。フォリアの反復低音型を基礎に多彩な変奏を展開するリュートのための変奏曲。ヴィゼーやコレッリらと同時代の17世紀フランス・バロック・リュートのフォリア。ミゲル・セルドゥラによる11コース・バロック・リュート演奏（Brilliant Classics 2008年）。" },
 { n:241, composer:"David Kellner", dates:"(1670–1748)", title:"Chaconne in A major", year:"c.1720", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・リュート", vid:"IBLscIOUN7I", performer:"Miguel Serdoura (11-course baroque lute, Brilliant Classics 2008)", startTime:"0:00", videoScope:"movement-only", desc:"ハンブルクのオルガニスト兼リュート作曲家ケルナーによるイ長調シャコンヌ。J.S.バッハと同時代のドイツ後期バロック・リュート語法を代表する変奏曲で、11コース・リュートの全音域を活かした対位法的変奏が印象的。ミゲル・セルドゥラによる11コース・バロック・リュート演奏（Brilliant Classics 2008年）。" },
 { n:242, composer:"Jacques de Saint-Luc", dates:"(1616–1710)", title:"Chaconne in D major", year:"c.1660", area:"fr", areaLabel:"フランドル/フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・リュート", vid:"-nc6nCGPCx8", performer:"(11-course baroque lute, gut strings)", startTime:"0:00", videoScope:"movement-only", desc:"フランドル出身のリュート奏者サン＝リュクによるニ長調シャコンヌ。ブリュッセル、ケルン、シュトゥットガルト、デュッセルドルフの宮廷を歴任した17世紀最長寿のリュート作曲家（94歳没）。フランス・バロック・リュートの語法を受け継ぎながらも独自の和声感覚を示す。11コース・バロック・リュート（ガット弦）による演奏。" },
 { n:243, composer:"Bernardo Pasquini", dates:"(1637–1710)", title:"Passacaglia", year:"c.1690", area:"it", areaLabel:"イタリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"チェンバロ", vid:"ZqtxiYyMWXo", performer:"Andreas Zappe (harpsichord after Dulcken by Cornelis Bom)", startTime:"0:00", videoScope:"movement-only", desc:"ローマ・バロック鍵盤音楽の大家パスクイーニによるパッサカリア。フレスコバルディからスカルラッティへの橋渡し役として、コレッリ、アレッサンドロ・スカルラッティらローマの音楽家たちと交流しつつ、イタリア鍵盤音楽を代表的に導いた。既収録のフォリア（n:22）と対をなすオスティナート変奏曲で、反復する低音型上に変幻自在の声部が積み重なる。アンドレアス・ツァッペによるコルネリス・ボム製ダルクン様式チェンバロ演奏。" },
 { n:244, composer:"Tarquinio Merula", dates:"(1594–1665)", title:"Ciaconna, Op.12 No.20 (Canzoni overo sonate concertate, 1637)", year:"1637", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"ヴァイオリン2＋通奏低音", vid:"1XB1CWuJW1U", performer:"Hanneke van Proosdij, Elizabeth Blumenstock (Voices of Music)", startTime:"0:00", videoScope:"movement-only", desc:"クレモナ出身のメルーラによる器楽チャッコーナ（Op.12 No.20, 1637年）。同作者が既収録の声楽チャッコーナ「スッラ・チェトラ・アモローザ」（n:14）とは全く別の純粋器楽作品で、2つのヴァイオリンが反復する低音型の上で競い合う活力溢れる変奏曲。ヴォイシズ・オブ・ミュージック（ハネッケ・ファン・プルースダイク、エリザベス・ブルーメンストック）による演奏。" },
 { n:245, composer:"Marco Uccellini", dates:"(c.1603–1680)", title:"Aria Quarta sopra la Ciaccona à 3 (Sonate, arie et correnti, Op.3)", year:"1642", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"ヴァイオリン2＋通奏低音", vid:"tVOJpnZZpk0", performer:"Ensemble Interchange (2024)", startTime:"0:00", videoScope:"movement-only", desc:"モデナ宮廷楽長ウッチェリーニの「ソナタ・アリア・コッレンティ」（Op.3, 1642年）から3声のチャッコーナ上のアリア第4番。コレッリ以前の北イタリア・バロック・ヴァイオリン音楽の最重要作曲家による、反復する低音型上の活き活きとした2つのヴァイオリンの掛け合いが光る傑作。既収録の「ラ・プロスペリーナ」（n:124）と並ぶウッチェリーニのオスティナート作品。アンサンブル・インターチェンジ（2024年）による演奏。" },
 { n:246, composer:"Joan Cabanilles", dates:"(1644–1712)", title:"Pasacalles del primer tono", year:"c.1680", area:"es", areaLabel:"スペイン", type:"passacaglia", typeLabel:"パサカリェス", instr:"オルガン", vid:"p6GrXtRkhyc", performer:"John Butt (organ)", startTime:"0:00", videoScope:"movement-only", desc:"バレンシア大聖堂の大オルガン奏者カバニリェスによるパサカリェス第1旋法。スペイン・バロック鍵盤音楽の代表的なカバニリェスが遺した多数のパサカリェス（パッサカリア）のうち、第1旋法（ニ短調）によるもの。スペイン固有のオルガン語法と反復低音変奏の伝統を融合した作品。ジョン・バットによるオルガン演奏。" },
 { n:247, composer:"Gaspar Sanz", dates:"(1640–1710)", title:"Passacalles por la cruz (Instrucción de música, 1674)", year:"1674", area:"es", areaLabel:"スペイン", type:"passacaglia", typeLabel:"パサカリェス", instr:"バロック・ギター", vid:"4GnuvRkgDE8", performer:"Maurizio Manzon (baroque guitar)", startTime:"0:00", videoScope:"movement-only", desc:"スペイン・バロック・ギター音楽の到達点「ギター演奏の指針」（サラゴサ、1674年）収録の「十字架のパサカリェス」。既収録のフォリア（n:4）とは異なるオスティナート低音型を用いた変奏で、当時のスペイン・ギター音楽の多様なバス定型を示す。マウリッツィオ・マンツォンによるバロック・ギター演奏。" },
 { n:248, composer:"Francesco Maria Veracini", dates:"(1690–1768)", title:"IV. Ciacona (Sonate accademiche, Op.2 No.12 in D minor)", year:"1744", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"バロック・ヴァイオリン＋通奏低音", vid:"DAYWBAJZVRU", performer:"Ensemble ad Libitum (Go Yamamoto, violin; Adrienne Shipley, harpsichord)", parentWork:"Sonate accademiche, Op. 2, No. 12 in D minor (1744)", movement:"IV. Ciacona (Allegro ma non presto)", startTime:"0:00", videoScope:"movement-only", desc:"フィレンツェ出身のヴァイオリンの鬼才ヴェラチーニによる「アカデミー・ソナタ集」（Op.2, 1744年）最終第12番（ニ短調）の終楽章チャッコーナ。コレッリのOp.5第12番（フォリア）に倣い全集の掉尾を飾る反復低音変奏曲。全4楽章（パッサカリア・クロマティック・カプリッチョ・アダージョ・チャッコーナ）の最後に置かれたこの曲は、17世紀初頭のチャッコーナ和声型をコンチェルタントな技巧で昇華した傑作。アンサンブル・アド・リビトゥム（山本剛ヴァイオリン、エードリアン・シップリーチェンバロ）による演奏（第3・第4楽章）。" },
 { n:249, composer:"Ennemond Gaultier", dates:"(1575–1651)", title:"Chaconne du Vieux Gaultier in C major (Ms. Vaudry de Saizenay)", year:"c.1650", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・リュート", vid:"AunGy8qH-Vs", performer:"David Hernández Romero (13-course baroque lute, 2018)", startTime:"0:00", videoScope:"movement-only", desc:"「ヴィユー・ゴルティエのシャコンヌ」として知られる、ヴォドリ・ド・セゼネイ写本に伝わるエヌモン・ゴルティエのハ長調シャコンヌ。フランス・バロック・リュート音楽の黄金時代を代表する作品で、後にダングルベールがチェンバロ用に編曲したことでも名高い。既収録のラ・カスカード（F長調、n:235）と並ぶゴルティエと並ぶ。ダビド・エルナンデス・ロメロによる13コース・バロック・リュート演奏（2018年）。" },
 { n:250, composer:"Louis Couperin", dates:"(c.1626–1661)", title:"Passacaille en sol mineur (Ms. Bauyn, c.1660)", year:"c.1656", area:"fr", areaLabel:"フランス", type:"passacaglia", typeLabel:"パッサカリア", instr:"チェンバロ", vid:"DKbOe7IndLg", performer:"Gustav Leonhardt (harpsichord)", startTime:"0:00", videoScope:"movement-only", desc:"パリ・バロック鍵盤音楽の巨匠ルイ・クープランによるト短調パッサカリア。ボワン写本（c.1660年）に収められた唯一現存する2つのパッサカリアの1つで、既収録のハ長調（n:47）と対をなす姉妹作。深い内省性と対位法的変奏の豊かさが際立ち、クープラン一族のフランス鍵盤音楽への貢献を端的に示す傑作。グスタフ・レオンハルトによるチェンバロ演奏。" },
 { n:251, composer:"Jean-Féry Rebel", dates:"(1666–1747)", title:"Les Plaisirs champêtres — Chaconne (1734)", year:"1734", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック管弦楽", vid:"6lrZ0dPXW4w", performer:"Royal Baroque Ensemble (St Michael's Battersea, 2015)", startTime:"0:00", videoScope:"movement-only", desc:"「レ・ゾレマン」（n:113）で知られるルベルの田園バレ「田舎の喜び」（1734年）からのシャコンヌ。組曲中の変奏楽章で、フランス・バロック後期の充実したオーケストレーションを示す。すでに67歳を超えたルベルが書き残した円熟の傑作。ロイヤル・バロック・アンサンブルによる演奏（ロンドン、2015年）。" },
 { n:252, composer:"Jean-Baptiste Lully", dates:"(1632–1687)", title:"Passacaille from Amadis, LWV 63", year:"1684", area:"fr", areaLabel:"フランス", type:"passacaglia", typeLabel:"パッサカリア", instr:"バロック管弦楽", vid:"vJrrfz_ELs4", performer:"Orchestre Giourdina", parentWork:"Amadis, LWV 63 (1684)", startTime:"0:00", videoScope:"movement-only", desc:"リュリのトラジェディ・リリック「アマディス」（1684年）からのパッサカリア。「アルミード」のパッサカリア（n:74）と並ぶリュリの2大変奏曲で、騎士道的英雄劇にふさわしい荘厳な気品を示す。15世紀ポルトガルの騎士アマディス・デ・ガウラの冒険を題材とした最後のクラシック期トラジェディの頂点。オルケストル・ジュルダンによる演奏。" },
 { n:253, composer:"Jean-Philippe Rameau", dates:"(1683–1764)", title:"Chaconne from Hippolyte et Aricie, RCT 43 (Act V)", year:"1733", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック管弦楽", vid:"xUVRnrlS_IM", performer:"La Petite Bande (Sigiswald Kuijken, conductor)", parentWork:"Hippolyte et Aricie, RCT 43 (1733)", movement:"Act V: Chaconne", startTime:"0:00", videoScope:"movement-only", desc:"ラモーのオペラデビュー作「イポリートとアリシー」（1733年10月1日パリ・オペラ座初演）第5幕シャコンヌ。フランス・バロック・オペラの伝統に革命をもたらしたこの作品は、豊かな和声法と管弦楽法でリュリ以来の固定観念を打ち破った傑作。既収録の「カストルとポリュクス」（n:96）とと並ぶラモー初期の代表作。ラ・プティット・バンド（シギスバルト・クイケン指揮）による演奏。" },
 { n:254, composer:"Jean-Philippe Rameau", dates:"(1683–1764)", title:"Zoroastre — Air en Chaconne, RCT 62", year:"1749", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック管弦楽", vid:"jqYeKqmMONk", performer:"Ensemble Eduard Melkus (Eduard Melkus, conductor)", parentWork:"Zoroastre, RCT 62 (1749/1756)", startTime:"0:00", videoScope:"movement-only", desc:"ラモーの魔術的バレ「ゾロアストル」（初演1749年、改訂1756年）からのシャコンヌ形式のエール。善悪の対立というゾロアスター教の宇宙観を描いたラモー最もラジカルな傑作から抽出された器楽の特徴。同作者のシャコンヌ（n:51, 76, 94, 96, 97, 254）の系列に連なる後期傑作。アンサンブル・エドゥアルト・メルクスによる演奏。" },
 { n:255, composer:"Johann Kaspar Ferdinand Fischer", dates:"(c.1656–1746)", title:"Passacaille (Uranie Suite, Musikalischer Parnassus, c.1738)", year:"c.1738", area:"de", areaLabel:"ドイツ", type:"passacaglia", typeLabel:"パッサカリア", instr:"チェンバロ", vid:"q8eMrY8xJLg", performer:"William Christie (harpsichord)", parentWork:"Musikalischer Parnassus, Suite IX 'Uranie' (c.1738)", startTime:"0:00", videoScope:"movement-only", desc:"フィッシャーの傑作鍵盤曲集「音楽のパルナッソス」（c.1738年）第9番ウラニア組曲のパッサカリア。フィッシャー現存最長の作品で、オルフェウスとエウリュディケの悲劇を描くとも言われる深遠な変奏曲。既収録のフェートン組曲（n:141）と並ぶフィッシャーのオスティナート変奏と並ぶで、バッハのシャコンヌと同時代のドイツ鍵盤音楽の頂点の一つ。ウィリアム・クリスティによるチェンバロ演奏。" },
 { n:256, composer:"Jacques Champion de Chambonnières", dates:"(c.1601–1672)", title:"Chaconne en fa majeur (Ms. Bauyn, c.1660)", year:"c.1660", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"sbh7P3LZzDs", performer:"Andreas Zappe (harpsichord after Cornelis Bom)", startTime:"0:00", videoScope:"movement-only", desc:"フランス・クラヴサン音楽の始祖シャンボニエールによるヘ長調シャコンヌ。ボワン写本（c.1660年）に収められた4曲のシャコンヌのひとつで、ルイ・クープランらフランス鍵盤音楽第一世代の規範となった。フランス様式の典雅な装飾法と反復低音型を融合させ、後のダングルベール・クープランらに継承されるフランス鍵盤シャコンヌの源流。アンドレアス・ツァッペによるコルネリス・ボム製チェンバロ演奏。" },
 { n:257, composer:"Le Sieur de Machy", dates:"(fl.1655–1700)", title:"Chaconne en sol majeur (Pièces de Violle en Musique et en Tablature, 1685)", year:"1685", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"ヴィオラ・ダ・ガンバ独奏", vid:"4EUPERlQ8mg", performer:"Lies Wyers (viola da gamba)", startTime:"0:00", videoScope:"movement-only", desc:"「ヴィオル音楽・タブラチュア楽曲集」（1685年）を唯一の著作とする謎のフランス人ド・マシーによるト長調シャコンヌ。サント＝コロンブ（n:209）の伝統を受け継ぐ複声部独奏ヴィオル奏法の精華で、反復する低音型の上に複数の声部を重ねる独奏技術の頂点。フランス・ヴィオル音楽の孤高の名品のひとつ。リース・ウェイエルスによるヴィオラ・ダ・ガンバ演奏。" },
 { n:258, composer:"Lucas Ruiz de Ribayaz", dates:"(1626–after 1677)", title:"Chaconas y Marionas (Luz y Norte Musical, 1677)", year:"1677", area:"es", areaLabel:"スペイン", type:"ciaccona", typeLabel:"チャコナ", instr:"バロック・ハープ／ギター", vid:"ZNgqhjpSeAQ", performer:"Spanish Baroque Ensemble (Spanish Baroque in America)", startTime:"0:00", videoScope:"movement-only", desc:"マドリードで1677年に刊行されたスペイン・バロック舞踊・器楽の珍しい教則本「音楽の光と北極星」（Luz y Norte Musical）収録のチャコナとマリオナ。リバヤスはスペインのハープ・ギター奏者で、ガスパル・サンス（n:4, 248）と同時代のスペイン舞踊音楽の伝道者。このアンソロジーは「スペイン系バロック・イン・アメリカ」の文脈でも注目される稀少資料。" },
 { n:259, composer:"Heinrich Schütz", dates:"(1585–1672)", title:"'Es steh Gott auf,' SWV 356 (Symphoniae sacrae II, 1647)", year:"1647", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"チャッコーナ", instr:"ソプラノ2声＋弦楽＋通奏低音", vid:"7LwOw8DS2PM", performer:"TENET Vocal Artists & Spiritus Collective (Jolle Greenleaf, soprano)", startTime:"0:00", videoScope:"movement-only", desc:"「神は立ちたまえ」（詩篇68篇）SWV 356。モンテヴェルディの「ゼフィーロ・トルナ」（チャッコーナ形式）に基づくシュッツの神聖交響曲で、「交響曲集第2巻」（ドレスデン、1647年）に収録。プロテスタント宗教音楽にオスティナート・バスを導入した先駆的傑作で、ドイツ初期バロックとイタリア・マドリガーレ形式の接触を象徴する。TENETヴォーカル・アーティスツ＆スピリトゥス・コレクティヴによる演奏。" },
 { n:260, composer:"Georg Muffat", dates:"(1653–1704)", title:"Ciacona in G major (Apparatus Musico-Organisticus, 1690)", year:"1690", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"オルガン", vid:"gIyCnowBFko", performer:"Quinta Essentia (organ)", parentWork:"Apparatus Musico-Organisticus (1690)", startTime:"0:00", videoScope:"movement-only", desc:"ムッファトの「オルガン音楽装置」（ウィーン、1690年）所収のト長調チャッコーナ。同集の有名な「ト短調パッサカリア」（n:33）と対をなすで、二つのオスティナート変奏曲がドイツ・バロック・オルガン音楽の頂点を示す。イタリア・フランス・ドイツ三様式の融合を体現したムッファトの代表的オルガン作品。クインタ・エッセンティアによるオルガン演奏。" },
 { n:261, composer:"Francesca Caccini", dates:"(1587–c.1641)", title:"Ciaccona (Il primo libro delle Musiche, 1618)", year:"1618", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"声楽＋通奏低音", vid:"DmHhvpbxoNM", performer:"(soprano & continuo)", startTime:"0:00", videoScope:"movement-only", desc:"フィレンツェのメディチ宮廷で活躍したバロック女性作曲家フランチェスカ・カッチーニによる声楽チャッコーナ。「初版楽曲集」（Il primo libro delle Musiche, 1618年）に収録。女性作曲家として最初期の現存オペラ「ルッジェーロの解放」（1625年）を残した彼女が、オスティナート低音形式を声楽に昇華させた初期バロックの傑作。" },
 { n:262, composer:"Benedetto Ferrari", dates:"(c.1603–1681)", title:"'Amanti, io vi sò dire' (Ciaconna) (Musiche varie, Libro III, 1641)", year:"1641", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"カウンターテナー＋通奏低音", vid:"P_OdwHztT14", performer:"Philippe Jaroussky (countertenor), Ensemble Artaserse", startTime:"0:00", videoScope:"movement-only", desc:"テオルボ奏者・作曲家フェラーリによる声楽チャッコーナ「恋する君よ」。「独唱のためのさまざまな音楽集」第3巻（ヴェネツィア、1641年）収録。モンテヴェルディらが切り開いた通奏低音歌曲の伝統を受け継ぎ、反復する低音型の上に表情豊かな独唱が乗る初期バロックの名品。フィリップ・ジャルスキー（カウンターテナー）＆アンサンブル・アルタセルセによる演奏。" },
 { n:263, composer:"Heinrich Ignaz Franz Biber", dates:"(1644–1704)", title:"Ciacona in D major for Violin and Continuo (Ms. Kroměříž, c.1680)", year:"c.1680", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"バロック・ヴァイオリン＋通奏低音", vid:"ESOO29zAimg", performer:"Adriane Post (baroque violin, with score)", startTime:"0:00", videoScope:"movement-only", desc:"クロムニェジーシュ写本に伝わるビーバーのニ長調チャッコーナ。ロザリオ・ソナタのパッサカリア（n:31）やメンサ・ソノラのチャッコーナ（n:32）と並ぶビーバーのオスティナート変奏の傑作で、宮廷楽長としての技術的頂点を示す独奏作品。華麗な重音奏法と劇的な転調を駆使した変奏が連なる。アドリアン・ポストによるバロック・ヴァイオリン演奏（楽譜付き）。" },
 { n:264, composer:"Marin Marais", dates:"(1656–1728)", title:"Le Labyrinthe — Chaconne finale (Pièces de viole, Livre IV, 1717)", year:"1717", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"ヴィオラ・ダ・ガンバ＋通奏低音", vid:"JTj3ZMmjAiE", performer:"Cassandra Luckhardt (viola da gamba)", startTime:"0:00", videoScope:"movement-only", desc:"マレーの「ヴィオル曲集」第4巻（1717年）に収められた標題的大作「迷宮」の終結部シャコンヌ。全体は複雑な転調・転旋法の「迷宮」を経て、最後にシャコンヌが出口として現れる構造を持つ。ド・マシー（n:257）やサント＝コロンブ（n:209）の伝統を受け継ぐフランス・ヴィオル音楽後期の頂点。カサンドラ・ラッカートによるヴィオラ・ダ・ガンバ演奏。" },
 { n:265, composer:"Johann Sebastian Bach", dates:"(1685–1750)", title:"'Meine Tage in dem Leide' — Ciacona, BWV 150 mvt.7 (c.1708)", year:"c.1708", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"チャッコーナ", instr:"合唱＋弦楽＋通奏低音", vid:"1qWdALq02qo", performer:"Netherlands Bach Society", parentWork:"Nach dir, Herr, verlanget mich, BWV 150 (c.1708)", movement:"mvt.7: Chaconne 'Meine Tage in dem Leide'", startTime:"0:00", videoScope:"movement-only", desc:"バッハ最初期のカンタータ「主よ、汝に向かいて」BWV 150の終曲（第7曲）チャッコーナ「苦しみの中の我が日々」。繰り返す4小節の低音型の上に独唱と合唱が変奏を重ねるこのオスティナート・バスは、後にブラームスが交響曲第4番終楽章のパッサカリア（E短調）の直接的着想源として使用したことで名高い。ネーデルランド・バッハ協会による演奏。" },
 { n:266, composer:"Sylvius Leopold Weiss", dates:"(1687–1750)", title:"Chaconne in E♭ major (Lute Sonata No.10, WeissSW 10, final mvt.)", year:"c.1718", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・リュート", vid:"0nn_onZRo78", performer:"Nigel North (baroque lute)", parentWork:"Lute Sonata No.10 in E♭ major, WeissSW 10", startTime:"0:00", videoScope:"movement-only", desc:"ヴァイスのリュート・ソナタ第10番（WeissSW 10、変ホ長調）の終曲シャコンヌ。プレリュード・アルマンド・クーラント・ブレー・サラバンド・メヌエットに続く最終第7楽章で、ロンドン写本の中でヴァイス自身の手稿が唯一完全に現存するシャコンヌとしても貴重。既収録のイ長調チャッコーナ（n:42）と並ぶヴァイスのオスティナート変奏の傑作。ナイジェル・ノースによるバロック・リュート演奏。" },
 { n:267, composer:"Sylvius Leopold Weiss", dates:"(1687–1750)", title:"Chaconne in g minor (Lute Sonata No.14, WeissSW 14, final mvt.)", year:"c.1720s", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・リュート", vid:"gDYRnrH3lNs", performer:"Toyohiko Satoh (baroque lute)", parentWork:"Lute Sonata No.14 in g minor, WeissSW 14", startTime:"0:00", videoScope:"movement-only", desc:"ヴァイスのリュート・ソナタ第14番（WeissSW 14、ト短調）の終曲シャコンヌ。ロンドン写本収録のヌン・フルート＋リュート二重奏版ソナタのフィナーレで、ト短調の深い表情と変奏技法の精緻さが際立つ。豊田豊彦（佐藤豊彦）によるバロック・リュート演奏。" },
 { n:268, composer:"Sylvius Leopold Weiss", dates:"(1687–1750)", title:"Passacaglia in D major (Lute Sonata No.18, WeissSW 18, mvt.VI)", year:"c.1730s", area:"de", areaLabel:"ドイツ/オーストリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"バロック・リュート", vid:"x-jz5rsbQ6I", performer:"Yasunori Imamura (baroque lute)", parentWork:"Lute Sonata No.18 in D major, WeissSW 18", startTime:"0:00", videoScope:"movement-only", desc:"ヴァイスのリュート・ソナタ第18番（WeissSW 18、ニ長調）の第6楽章パッサカリア。ロンドン写本（ロンドン大英図書館）収録の大規模な変奏曲で、反復する短いバス音型の上に多彩な変奏が展開する。ギター編曲でも名高いヴァイスのオスティナート作品の中でも規模・密度ともに傑出した傑作。今村泰典によるバロック・リュート演奏。" },
 { n:269, composer:"Antonio Vivaldi", dates:"(1678–1741)", title:"Ciaccona (Chamber Concerto in g minor, RV 107, mvt.3)", year:"c.1720", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"フルート・オーボエ・ヴァイオリン・バスーン・通奏低音", vid:"cc6NUtAkZkw", performer:"Austrian Baroque Company", parentWork:"Chamber Concerto in g minor, RV 107 (c.1720)", movement:"mvt.3: Ciaccona", startTime:"0:00", videoScope:"full-work-with-timestamp", desc:"ヴィヴァルディの室内協奏曲ト短調 RV 107 の終楽章チャッコーナ。フルート・オーボエ・ヴァイオリン・バスーン・通奏低音という異種混成の独奏群をもつ《コンチェルト・ア・クアトロ》の最終楽章（第3楽章）で、反復する低音型の上にソリストたちが活気あるダイアローグを展開する。既収録の RV 114 ハ長調チャッコーナ（n:103）と対をなすヴィヴァルディ室内協奏曲の傑作。オーストリアン・バロック・カンパニーによる演奏。" },
 { n:270, composer:"Georg Friedrich Händel", dates:"(1685–1759)", title:"Chaconne and 26 Variations (Suite in C major, HWV 443, mvt.VI)", year:"c.1700–1703", area:"de", areaLabel:"ドイツ/イギリス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"dftJNNvooek", performer:"Roberto Loreggian (harpsichord)", parentWork:"Suite in C major, HWV 443 (c.1700–1703)", movement:"mvt.VI: Chaconne and Variations", startTime:"0:00", videoScope:"movement-only", desc:"ヘンデルのハ長調組曲 HWV 443 の終曲シャコンヌ（26変奏）。同じ素材の49変奏版 HWV 484（n:213）と並ぶ初期傑作で、ハレ時代からハンブルク・イタリア旅行期（1700–03年頃）に書かれたとされる。組曲の全6楽章を締めくくる変奏曲として、ヘンデルのバロック鍵盤音楽の多様性を示す。ロベルト・ロレッジャンによるチェンバロ演奏（「ヘンデル：チェンバロ全集」より）。" },
 { n:271, composer:"Robert de Visée", dates:"(c.1655–1732/33)", title:"Chaconne en sol majeur (Pièces de théorbe et de luth, 1716)", year:"1716", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"テオルボ", vid:"LO_jpR04Hfo", performer:"Xavier Díaz-Latorre (14-course theorbo)", parentWork:"Pièces de théorbe et de luth (Paris, 1716)", startTime:"0:00", videoScope:"movement-only", desc:"ルイ14世・15世両王に仕えたヴィゼーの「テオルボとリュートの小品集」（パリ、1716年）所収のト長調シャコンヌ。ニ短調組曲のシャコンヌ（n:79）と並ぶヴィゼーの2大シャコンヌで、テオルボの豊かな低音域を活かした重厚な変奏が特徴。ロベール・ド・ヴィゼーのテオルボ・リュート音楽の頂点の一つ。シャビエ・ディアス＝ラトーレによる14コース・テオルボ演奏。" },
 { n:272, composer:"Georg Friedrich Händel", dates:"(1685–1759)", title:"Chaconne (Almira, HWV 1, Act I, 1705)", year:"1705", area:"de", areaLabel:"ドイツ/イギリス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック管弦楽", vid:"eWBRbIO1T3E", performer:"Xenia Löffler, Batzdorfer Hofkapelle", parentWork:"Almira, Königin von Castilien, HWV 1 (Hamburg, 1705)", startTime:"0:00", videoScope:"movement-only", desc:"ヘンデル最初のオペラ「カスティリアの女王アルミラ」（ハンブルク、1705年1月8日初演）第1幕のシャコンヌ。19歳のヘンデルが書いたデビュー作に含まれる管弦楽舞曲で、フランツ・リストが後にピアノ用の「サラバンドとシャコンヌ」（1879年）として編曲したことで広く知られる。ヘンデルの生涯最初期のオスティナート変奏の記録。シェニア・レフラー＆バツドルファー・ホーフカペレによる演奏。" },
 { n:273, composer:"François Couperin", dates:"(1668–1733)", title:"Chaconne légère (Concerts Royaux, Concert No.3 in A major, mvt.VII)", year:"1714", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"フルート・ヴァイオリン・チェンバロ・ヴィオール", vid:"S1Yl8BX73mc", performer:"(baroque ensemble)", parentWork:"Concerts Royaux, Concert no.3 in A major (1714/1722)", movement:"mvt.VII: Chaconne légère", startTime:"0:00", videoScope:"movement-only", desc:"クープランの「王室室内楽コンサート」（1714年頃作曲、1722年出版）第3番イ長調の終曲シャコンヌ・レジェール。ルイ14世の日曜礼拝後の私的な演奏会のために書かれた室内楽曲集で、プレリュード・アルマンド・クーラント・サラバンド・ガヴォット・ミュゼットに続く第7楽章（最終楽章）。ラ・ファヴォリット（n:48）やレ・ナシオン（n:185,187）と並ぶクープランのシャコンヌ群の一翼。" },
 { n:274, composer:"Marin Marais", dates:"(1656–1728)", title:"Chaconne de l'Alcyone (Alcyone, 1706)", year:"1706", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック管弦楽", vid:"4oU9eVBt7W4", performer:"Jordi Savall, Le Concert des Nations", parentWork:"Alcyone, tragédie en musique (Paris, 1706)", startTime:"0:00", videoScope:"movement-only", desc:"マレーの傑作トラジェディ・リリック「アルシオーヌ」（1706年、パリ・オペラ座初演）のシャコンヌ。嵐の場面と並ぶ同作のハイライトで、4声部のヴィオールと通奏低音のために書かれたフランス・バロック管弦楽シャコンヌの精粋。既収録のマレー・ヴィオール曲集の多数のシャコンヌ（n:182–197等）に加わるオペラ由来の傑作。ジョルディ・サヴァール＆ル・コンセール・デ・ナシオンによる演奏。" },
 { n:275, composer:"Marin Marais", dates:"(1656–1728)", title:"Chaconne de Sémélé (Sémélé, Act II, 1709)", year:"1709", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック管弦楽（タンバリン・カスタネット付き）", vid:"8Re2dG8Kvi4", performer:"Le Concert Spirituel (Hervé Niquet, conductor)", parentWork:"Sémélé, tragédie en musique (Paris, 1709)", startTime:"0:00", videoScope:"movement-only", desc:"マレーのトラジェディ・リリック「セメレ」（1709年、パリ・オペラ座初演）第2幕の大シャコンヌ。タンバリンとカスタネットを伴う華やかな舞曲で、ユピテルによるセメレの変容を表現する第2幕の劇的核心。同作は長年忘却されていたが、2006年のボーヌ古楽祭でル・コンセール・スピリチュエルが蘇演し注目を集めた。エルヴェ・ニケ指揮ル・コンセール・スピリチュエルによる演奏。" },
 { n:276, composer:"Wolfgang Amadeus Mozart", dates:"(1756–1791)", title:"Chaconne (Ballet music for Idomeneo, K.367, No.1)", year:"1781", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"シャコンヌ", instr:"古典派管弦楽", vid:"A6uO2HRb8hU", performer:"(classical orchestra)", parentWork:"Idomeneo, re di Creta, K.366/367 (München, 1781)", movement:"Ballet music K.367, No.1: Chaconne", startTime:"0:00", videoScope:"movement-only", desc:"モーツァルトのオペラ・セリア「イドメネオ」（ミュンヘン、1781年1月29日初演）付随バレ音楽 K.367 の第1番シャコンヌ。グルックの「イフィジェニー・ザ・オーリス」のバレ音楽を引用しつつ、古典派語法でシャコンヌ形式を更新した18世紀末の傑作。既収録のグルック（n:228）、ボッケリーニ（n:227）とともに「古典派のシャコンヌ」の頂点をなす。" },
 { n:277, composer:"Louis Couperin", dates:"(c.1626–1661)", title:"Chaconne en fa majeur (Ms. Bauyn, c.1656)", year:"c.1656", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"zT6EArneNtE", performer:"Andreas Zappe (harpsichord)", startTime:"0:00", videoScope:"movement-only", desc:"パリ・バロック鍵盤音楽の巨匠ルイ・クープランによるヘ長調シャコンヌ。ボワン写本（c.1660年）に収められた作品で、既収録のパッサカリア ハ長調（n:47）・ト短調（n:250）と並ぶルイ・クープランのオスティナート変奏曲群の一翼。師シャンボニエール（n:256）の影響下で確立されたフランス鍵盤シャコンヌの様式を受け継ぎ、後のフランソワ・クープランらに継承される。アンドレアス・ツァッペによるチェンバロ演奏。" },
 { n:278, composer:"Louis Couperin", dates:"(c.1626–1661)", title:"Chaconne en ré mineur (Ms. Bauyn, c.1656)", year:"c.1656", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"D-Jk6yOmXnY", performer:"Luuk Torn (harpsichord)", startTime:"0:00", videoScope:"movement-only", desc:"ルイ・クープランによるニ短調シャコンヌ。ボワン写本収録のヘ長調シャコンヌ（n:277）と対をなす作品で、短調の深い抒情性と格調ある変奏が際立つ。クープラン一族によるフランス鍵盤音楽の礎となった初期傑作。ルーク・トーンによるチェンバロ演奏。" },
 { n:279, composer:"Marin Marais", dates:"(1656–1728)", title:"Chaconne en ut majeur (Pièces en trio, Suite no.1, 1692)", year:"1692", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"ヴァイオリン・フルート・ヴィオラ・ダ・ガンバ・通奏低音", vid:"8bynZEgoGZc", performer:"(baroque ensemble)", parentWork:"Pièces en trio pour les flûtes, violon & dessus de viole (Paris, 1692)", startTime:"0:00", videoScope:"movement-only", desc:"マレーの「フルート・ヴァイオリン・ヴィオール高音部のためのトリオ小品集」（パリ、1692年）第1組曲ハ長調の終曲シャコンヌ。ヴィオール曲集の多数のシャコンヌ（n:182–197等）や「アルシオーヌ」「セメレ」の管弦楽版（n:274, 276）と並ぶマレーのシャコンヌ群のうち、室内楽三重奏形式による傑作。1692年出版の初期作品ながらフランス・バロック室内楽の精華を示す。" },
 { n:280, composer:"Girolamo Frescobaldi", dates:"(1583–1643)", title:"Partite sopra ciaccona (Toccate e partite d'intavolatura, Libro II, 1627)", year:"1627", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"チェンバロ", vid:"yIXT4SzTIUM", performer:"Richard Egarr (harpsichord)", parentWork:"Toccate e partite d'intavolatura di cembalo, Libro II (1627)", startTime:"0:00", videoScope:"movement-only", desc:"フレスコバルディの「第2鍵盤曲集」（1627年）収録の「チャッコーナ上の変奏曲」。既収録の「バレットとチャッコーナ」(F 2.32, n:11)・「パッサカリア上の100の変奏」(n:12)と並ぶ同集のオスティナート変奏曲で、チャッコーナ形式の楽曲として独立した変奏組曲を形成する。グラウンド・バス上に次々と変奏が連なるバロック初期イタリアの傑作。後にバッハの「シャコンヌ」に代表されるドイツ・バロック変奏の系譜に影響を与えた。リチャード・イーガーによるチェンバロ演奏。" },
 { n:281, composer:"Andrea Falconieri", dates:"(c.1585–1656)", title:"Ciaccona (Il primo libro di canzone, 1650)", year:"1650", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"バロック合奏", vid:"e6p-UmhD170", performer:"Australian Brandenburg Orchestra (Paul Dyer, conductor)", parentWork:"Il primo libro di canzone, sinfonie, fantasie... (Naples, 1650)", startTime:"0:00", videoScope:"movement-only", desc:"ナポリ宮廷楽長ファルコニエーリの「第1カンツォーナ集」（ナポリ、1650年）収録の無題チャッコーナ。同集に収められた「ラ・モナルカ」（n:15）とは別の独立したチャッコーナ曲で、ファルコニエーリのナポリ・バロック様式の典型を示す。反復する短い低音型の上に活発なダイアローグが展開する小編成バロック合奏の傑作。オーストラリア・ブランデンブルク管弦楽団（ポール・ダイヤー指揮）による演奏。" },
 { n:282, composer:"Nicolas Vallet", dates:"(c.1583–c.1642)", title:"Chaconne (Le Secret des Muses, Book II, 1616)", year:"1616", area:"fr", areaLabel:"フランス/オランダ", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・リュート", vid:"BBUr97bB2Cg", performer:"(baroque lute)", parentWork:"Le Secret des Muses, Livre II (Amsterdam, 1616)", movement:"Chaconne (preceded by Prélude)", startTime:"1:30", videoScope:"full-work-with-timestamp", desc:"フランス人リュート奏者ヴァレーがアムステルダムに移住後に刊行した「詩女神の秘密」第2巻（1616年）収録のシャコンヌ。同動画はプレリュードに続くシャコンヌ（最終曲）を収録。ユグノー難民としてオランダに定住したヴァレーは、フランス・バロック・リュート音楽とネーデルラント音楽文化の橋渡しをした重要人物。17世紀初頭の現存するシャコンヌの中でも最古の部類に属する希少な記録。" },
 { n:283, composer:"Johann Kaspar Ferdinand Fischer", dates:"(c.1656–1746)", title:"Chaconne en fa majeur (Suite 'Euterpe', Musicalischer Parnassus, c.1738)", year:"c.1738", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"ccWoPFnWi1E", performer:"Peter Waldner (original Colmar Ruckers, 1624)", parentWork:"Musicalischer Parnassus, Suite II 'Euterpe' (c.1738)", startTime:"0:00", videoScope:"movement-only", desc:"フィッシャーの「音楽のパルナッソス」（c.1738年）第2番「エウテルペ」組曲のシャコンヌ（ヘ長調）。9つのミューズ女神名を冠した各組曲に含まれるシャコンヌ・パッサカリアの系列で、既収録の「ウラニア」組曲パッサカリア（n:255）と並ぶ。プレリュードに続く終曲として書かれた堂々たる変奏曲で、バッハと同時代のドイツ鍵盤音楽の洗練を示す。ペーター・ヴァルドナーによる1624年製コルマール・リュッカース・オリジナル・チェンバロ演奏。" },
 { n:284, composer:"Germain Pinel", dates:"(c.1600–1661)", title:"Chaconne en sol mineur (Ms. c.1650–1660)", year:"c.1655", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・リュート", vid:"exn2StR1h0I", performer:"Miguel Serdoura (11-course baroque lute)", startTime:"0:00", videoScope:"movement-only", desc:"ルイ14世の宮廷リュート奏者ピネルによるト短調シャコンヌ。「ヴェルサイユの王たち」（Les Rois de Versailles, 2014）に収録されたフランス宮廷リュート音楽の傑作で、ロベール・ド・ヴィゼー（n:79, 272）の師に当たる世代の作品。写本に伝わるフランス宮廷バロック・リュートのシャコンヌとして、ロラン・ムラル（n:236–239）らとともに17世紀フランス・リュート音楽の中核をなす。ミゲル・セルドゥラによる11コース・バロック・リュート演奏。" },
 { n:285, composer:"Louis Couperin", dates:"(c.1626–1661)", title:"Chaconne en sol mineur (Ms. Bauyn, c.1658)", year:"c.1658", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"hsZ7c5SAd-c", performer:"(harpsichord)", startTime:"0:00", videoScope:"movement-only", desc:"ルイ・クープランによるト短調シャコンヌ。ボワン写本に収められた作品で、既収録のヘ長調（n:277）・ニ短調（n:278）と並ぶ3つのシャコンヌの一つ。また2つのパッサカリア（n:47, n:250）とあわせルイ・クープランのオスティナート変奏曲群の全貌を示す。ト短調の深い抒情と格調高い変奏技法はフランス鍵盤バロックの精髄で、後のフランソワ・クープラン（n:88, 274）らに継承される様式の源流。" },
 { n:286, composer:"Johann Georg Weichenberger", dates:"(1676–1740)", title:"Chaconne in a minor (Praha Manuscript)", year:"c.1720", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・リュート", vid:"WVnNM4_jh3w", performer:"Maximiliano Y. Pacheco (13-course baroque lute)", startTime:"0:00", videoScope:"movement-only", desc:"オーストリアのリュート奏者・作曲家ヴァイヒェンベルガーによるイ短調シャコンヌ。プラハ写本（Praha manuscript）に伝わる作品で、11コース・リュートのための初期バロック音楽を書いたウィーン宮廷系の作曲家として知られる。ヴァイスやガロ（n:238–241）と同時代のドイツ・バロック・リュート音楽圏を代表する知られざる傑作。マクシミリアーノ・パチェコによる13コース・バロック・リュート演奏。" },
 { n:287, composer:"Johann Kaspar Ferdinand Fischer", dates:"(c.1656–1746)", title:"Chaconne (Le Journal du Printemps, Op.1, Suite No.1 in C major, mvt.VI)", year:"1695", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック管弦楽", vid:"6RcLfDJg1YQ", performer:"(baroque orchestra)", parentWork:"Le Journal du Printemps, Op.1 (1695)", movement:"Suite No.1 in C major, mvt.VI: Chaconne", startTime:"6:11", videoScope:"full-work-with-timestamp", desc:"フィッシャーの処女作「春の日誌」（Op.1、1695年）第1番ハ長調序曲組曲の終曲シャコンヌ（第6楽章）。序曲（フランス風）・行進曲・戦士たちのエール・リゴドン・メヌエットに続く最終楽章で、8つの序曲組曲すべてがシャコンヌまたはパッサカリアで締めくくられるという独自の構成を持つ。バッハ以前にフランス・バロック様式をライン川流域のドイツへ系統的に導入した先駆的作品。既収録の「音楽のパルナッソス」（n:141, 256, 284）と並ぶフィッシャーのオスティナート変奏群。" },
 { n:288, composer:"Georg Philipp Telemann", dates:"(1681–1767)", title:"Chaconne 'Modéré' (Paris Quartet No.6 in E minor, TWV 43:e4, mvt.VI)", year:"1738", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"シャコンヌ", instr:"フルート・オーボエ・ヴァイオリン・通奏低音", vid:"MkBPMTWCpQI", performer:"Tempesta di Mare Chamber Players", parentWork:"Nouveaux Quatuors Parisiens, No.6 in E minor, TWV 43:e4 (Paris, 1738)", movement:"mvt.VI: Chaconne 'Modéré'", startTime:"0:00", videoScope:"movement-only", desc:"テレマンの「新パリ四重奏曲集」（パリ、1738年）第6番ホ短調（TWV 43:e4）の終曲シャコンヌ「モデレ」。フランス滞在中に書かれたフランス宮廷様式のカルテットで、フルート・オーボエ・ヴァイオリン・通奏低音という編成の第6楽章（最終楽章）。既収録の「リリパット人のシャコンヌ」（n:210）・パッサカリア（n:60, 99）と並ぶテレマンのオスティナート変奏の一翼。テンペスタ・ディ・マーレ室内楽団による演奏。" },
 { n:289, composer:"Georg Friedrich Händel", dates:"(1685–1759)", title:"Chaconne with 10 Variations in D minor, HWV 448", year:"c.1705–10", area:"de", areaLabel:"ドイツ/イギリス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"YWWq4ei2znw", performer:"(harpsichord)", parentWork:"Suite in D minor, HWV 448", startTime:"0:00", videoScope:"movement-only", desc:"ヘンデルのニ短調組曲 HWV 448 のシャコンヌ（10変奏）。既収録のト長調21変奏（HWV 435, n:58）・62変奏（HWV 442, n:83）・26変奏（HWV 443, n:270）・49変奏（HWV 484, n:213）と並ぶヘンデルの鍵盤シャコンヌ群の一翼で、ドイツ・バロック初期（1705–10年頃）に書かれた比較的コンパクトな変奏曲。ニ短調の内省的な美しさが際立つ。" },
 { n:290, composer:"Santiago de Murcia", dates:"(c.1673–1739)", title:"Pasacalle por la E (Passacalles y Obras, 1732)", year:"c.1730", area:"es", areaLabel:"スペイン", type:"passacaglia", typeLabel:"パサカリェ", instr:"バロック・ギター", vid:"lEheT51R910", performer:"Francisco Villegas (baroque guitar)", parentWork:"Passacalles y Obras de Guitarra (Ms. Saldívar No.4, 1732)", startTime:"0:00", videoScope:"movement-only", desc:"スペイン後期バロック・ギターの最重要人物ムルシアの「パサカリェ集と作品集」（1732年サルディバール写本）収録のミ調パサカリェ。フォリア（n:81）、クンベエス（n:109）と並ぶムルシア三大オスティナート曲の一つで、ガスパル・サンスの「パサカリェス」（n:247）の伝統を受け継ぐスペイン・バロック・ギターの精粋。下降するフリギア低音型の上に28のパサカリェを連ねた大規模な変奏組曲。フランシスコ・ビジェガスによるバロック・ギター演奏。" },
 { n:291, composer:"Santiago de Murcia", dates:"(c.1673–1739)", title:"Fandango (Passacalles y Obras, 1732)", year:"c.1730", area:"es", areaLabel:"スペイン", type:"other", typeLabel:"ファンダンゴ", instr:"バロック・ギター", vid:"I_K2KOBDePA", performer:"Stefano Maiorana (baroque guitar)", parentWork:"Passacalles y Obras de Guitarra (Ms. Saldívar No.4, 1732)", startTime:"0:00", videoScope:"movement-only", desc:"現存する最古期のファンダンゴ楽譜の一つとして知られるムルシアのファンダンゴ。「パサカリェ集と作品集」（1732年サルディバール写本）所収で、フリギア終止を基礎とする反復バス上に活気ある変奏を展開するスペイン民俗舞踊の源流。アントニオ・ソレルの「ファンダンゴ」（n:204）より50年以上先立つ初期記録として歴史的価値が高い。ステファノ・マイオラーナによるバロック・ギター演奏。" },
 { n:292, composer:"Christopher Simpson", dates:"(c.1602–1669)", title:"Division on a Ground in B-flat major (The Division Viol, 1659)", year:"1659", area:"en", areaLabel:"イングランド", type:"other", typeLabel:"ディヴィジョン", instr:"ヴィオラ・ダ・ガンバ＋通奏低音", vid:"beDOk5LnyZE", performer:"(viola da gamba)", parentWork:"The Division Viol (London, 1659/1665)", startTime:"0:00", videoScope:"movement-only", desc:"イングランドのディヴィジョン・ヴィオル奏法の到達点「ディヴィジョン・ヴィオル」（1659年）収録の変ロ長調グラウンド。同書は反復低音型の上に即興的変奏（ディヴィジョン）を展開する技法の教則本として画期的で、既収録のホ短調（n:52）とは異なる調性・性格を持つ。イングランドのオスティナート・バス伝統の核心をなすシンプソン変奏術の特徴。" },
 { n:293, composer:"Giovanni Battista Granata", dates:"(c.1620–c.1687)", title:"Capriccio sopra la chiaccona in C major (Capricci armonici, 1659)", year:"1659", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャコーナ", instr:"バロック・ギター", vid:"NqsynoiNgO0", performer:"Daniel Oman (baroque guitar)", parentWork:"Capricci armonici sopra la chitarriglia spagnola (Bologna, 1659)", startTime:"0:00", videoScope:"movement-only", desc:"ボローニャのバロック・ギター奏者・作曲家グラナータの「スペイン式ギタールのための和声的奇想曲集」（1659年）収録の「チャコーナ上のカプリッチョ」ハ長調。ファルコニエーリ（n:15, 282）と並ぶ17世紀イタリア・バロック・ギターのチャコーナ様式を代表する作品。グラナータは多数のチャコーナ・パッサカリアを残し、コルベッタ（n:50, 175, 245）やヴィゼー（n:79, 272）と並ぶバロック・ギター黄金時代の主要作曲家。ダニエル・オーマンによるバロック・ギター演奏。" },
 { n:294, composer:"Heinrich Ignaz Franz Biber", dates:"(1644–1704)", title:"Ciacona (Harmonia artificioso-ariosa, Partia III in A major, 1696)", year:"1696", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"2ヴァイオリン＋通奏低音", vid:"H9wKFH6qJ10", performer:"Musica Antiqua Köln (Reinhard Goebel)", parentWork:"Harmonia artificioso-ariosa, Partia III in A major (Salzburg, 1696)", startTime:"0:00", videoScope:"movement-only", desc:"ビーバーの晩年の大作「巧みな和声」（1696年）第3番イ長調パルティアの終曲チャッコーナ。2ヴァイオリンと通奏低音のための七つのパルティアからなるこの曲集は、スクルダトゥーラ（変則調弦）を駆使した技巧的傑作であり、各パルティアをシャコンヌまたはパッサカリアで締めくくるという独自の構成を持つ。ロザリオ・ソナタのパッサカリア（n:31）、メンサ・ソノーラのチャッコーナ（n:32）、クロムニェジーシュ写本のチャッコーナ（n:263）と並ぶビーバーのオスティナート変奏の一翼。ムジカ・アンティクァ・ケルン（ラインハルト・ゲーベル指揮）による演奏。" },
 { n:295, composer:"Heinrich Ignaz Franz Biber", dates:"(1644–1704)", title:"Passacaglia (Harmonia artificioso-ariosa, Partia V in D major, 1696)", year:"1696", area:"de", areaLabel:"ドイツ/オーストリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"2ヴァイオリン＋通奏低音", vid:"PUrNbG0iLlY", performer:"Musica Antiqua Köln (Reinhard Goebel)", parentWork:"Harmonia artificioso-ariosa, Partia V in D major (Salzburg, 1696)", startTime:"0:00", videoScope:"movement-only", desc:"「巧みな和声」（1696年）第5番ニ長調パルティアの終曲パッサカリア。スクルダトゥーラ調弦による2声部のヴァイオリンと通奏低音という編成で、ニ長調の堂々たるオスティナート低音上に重層的な変奏を展開する。同曲集第3番のチャッコーナ（n:294）とともに「巧みな和声」を代表するオスティナート変奏曲。ムジカ・アンティクァ・ケルン（ラインハルト・ゲーベル指揮）による演奏。" },
 { n:296, composer:"Maurizio Cazzati", dates:"(c.1616–1678)", title:"Ciaccona a 3 (Correnti, balletti, galiarde, Op.15, 1659)", year:"1659", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"2ヴァイオリン＋ヴィオローネ＋通奏低音", vid:"R8p4rtfGgQ4", performer:"(baroque ensemble)", parentWork:"Correnti, balletti, galiarde a 3 e 4, Op.15 (Bologna, 1659)", startTime:"0:00", videoScope:"movement-only", desc:"ボローニャ楽派の先駆者カッツァーティによるOp.15「コッレンテ・バッレット・ガリアルダ集」（1659年）所収の3声チャッコーナ。既収録のニ長調Op.35（n:116）より6年早く書かれた初期ボローニャ弦楽様式のチャッコーナで、2ヴァイオリン・ヴィオローネ・通奏低音という当時の室内楽編成による。コレッリ以前のボローニャ器楽の系譜を辿る重要な作品。" },
