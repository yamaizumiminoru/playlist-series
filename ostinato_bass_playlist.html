 { n:297, composer:"Johann Christoph Pezel", dates:"(1639–1694)", title:"Sonata-Ciacona a 6 in B-flat major (Opus Musicum Sonatarum, 1686)", year:"1686", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"チャッコーナ", instr:"弦楽6声部＋通奏低音", vid:"naRNVnPvm7s", performer:"ACRONYM", parentWork:"Opus Musicum Sonatarum Praestantissimarum (Frankfurt, 1686)", startTime:"0:00", videoScope:"movement-only", desc:"ライプツィヒの市参事会音楽家ペツェルによる「アルファベット・ソナタ集」（Opus Musicum、1686年）所収のシャコンヌ風ソナタ変ロ長調。6声部弦楽と通奏低音のための大規模な通奏低音変奏ソナタで、ライプツィヒのバッハ以前における多声弦楽音楽の水準を示す。ACRONYM（アクロニム）アンサンブルによる演奏。" },
 { n:298, composer:"Jean-Baptiste Lully", dates:"(1632–1687)", title:"Chaconne des Scaramouches, Trivelins et Arlequins (Le Bourgeois Gentilhomme, LWV 43, 1670)", year:"1670", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック室内楽", vid:"Ufv736EAFPs", performer:"KC Baroque (Trevor Stewart, recorder; Monty Carter, baroque violin)", parentWork:"Le Bourgeois Gentilhomme, LWV 43 (Paris, 1670)", startTime:"0:00", videoScope:"movement-only", desc:"モリエールとリュリの共作によるコメディ・バレ「町人貴族」（1670年、ヴェルサイユ初演）のシャコンヌ。道化師スカラムーシュ・トリヴランドとアルルカンのシャコンヌとして第4幕に登場する舞踏音楽。既収録のリュリ・オペラのシャコンヌ群（n:44, 73-75, 84, 108, 253）とは異なり、コメディ・バレ（悲劇的歌劇ではなく）に属する点でユニーク。イタリア仮面喜劇の登場人物を配した軽妙なフランス・バロック舞踏音楽の傑作。KCバロック・コンソーシアムによる室内楽演奏。" },
 { n:299, composer:"Jean-Baptiste Lully", dates:"(1632–1687)", title:"Trio de la Chambre du Roi, LWV 25 — Chaconne", year:"c.1665", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"ヴァイオリン・リコーダー・テオルボ・チェロ", vid:"TOzfH0LhesA", performer:"Three Notch'd Road — The Virginia Baroque Ensemble (Fiona Hughes, violin)", parentWork:"Trio de la Chambre du Roi, LWV 25", startTime:"0:00", videoScope:"movement-only", desc:"リュリが国王の宮廷室内楽のために書いた「王の間の三重奏曲」（LWV 25）のシャコンヌ。オペラのシャコンヌ群（n:44, 73-75等）とは異なる純粋な器楽室内楽作品で、リュリ初期の宮廷音楽活動を伝える。ヴァイオリン・リコーダー・テオルボ・チェロという当時の室内楽編成による演奏。スリー・ノッチド・ロード（バージニア・バロック・アンサンブル）による2019年演奏。" },
 { n:300, composer:"André Raison", dates:"(c.1640–1719)", title:"Trio en Chaconne (Premier Livre d'Orgue, 1688)", year:"1688", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"オルガン", vid:"4X83OiUvmoI", performer:"Leonard Byun (Dr.Claveciniste, organ)", parentWork:"Premier Livre d'Orgue (Paris, 1688)", startTime:"1:36", videoScope:"full-work-with-timestamp", desc:"フランスのオルガン奏者レゾンの「第1オルガン曲集」（1688年）収録のシャコンヌ三重奏。同集には「パッサカイユ三重奏」（BWV 582の先行作品、n:88）とともに収録されており、パッサカイユに続いてシャコンヌが演奏される。フランス・バロック・オルガン様式のシャコンヌの典型例で、2つの声部が下声部（オルガン・バス）のオスティナートの上で旋律を交錯させる。レオナルド・ビュン（ドクター・クラヴサニスト）による2025年ソウル録音。" },
 { n:301, composer:"Adam Jarzębski", dates:"(c.1590–c.1648)", title:"Tamburetta (Canzoni e Concert, 1627)", year:"1627", area:"pl", areaLabel:"ポーランド", type:"ciaccona", typeLabel:"チャッコーナ（タンブレッタ）", instr:"2ヴァイオリン＋ヴィオラ・ダ・ガンバ＋通奏低音", vid:"oL4-irZTlWs", performer:"Lucy Van Dael (vn., dir.) and ensemble", parentWork:"Canzoni e Concert (Warsaw, 1627)", startTime:"0:00", videoScope:"movement-only", desc:"ポーランド・バロック初期の代表的作曲家ヤジェンプスキによる「タンブレッタ（小太鼓）」。ヴァルシャワ宮廷に仕えた宮廷音楽家が1627年に出版した「カンツォーニ・エ・コンチェルト」所収。反復する太鼓のリズムを模倣したオスティナート低音上に2つのヴァイオリンが掛け合う早期バロック様式のチャッコーナで、中央ヨーロッパにおける反復低音の伝播を示す歴史的証拠。中世から続くポーランド＝ドイツ宮廷音楽交流の果実。ルーシー・ファン・ダール指揮アンサンブルによる演奏。" },
 { n:302, composer:"Élisabeth Jacquet de la Guerre", dates:"(1665–1729)", title:"Chaconne in A minor (Pièces de clavecin, 1707)", year:"c.1707", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"t2ivdHBLlMg", performer:"Byron Schenkman (harpsichord)", parentWork:"Pièces de clavecin qui peuvent se jouer sur le violon (1707)", startTime:"0:00", videoScope:"movement-only", desc:"フランス初の女性バロック作曲家ジャケ・ド・ラ・ゲールのイ短調シャコンヌ。既収録のニ長調シャコンヌ（n:86, 1687年）より後期の作品で、「ヴァイオリンでも弾ける鍵盤曲集」（1707年）に収録。ルイ14世の太陽王宮廷で5歳の神童として認められた唯一の女性作曲家による、暗鬱で内省的なイ短調の変奏曲。バイロン・シェンクマン（チェンバロ）による単独楽章録音。" },
 { n:303, composer:"Johann Joseph Fux", dates:"(1660–1741)", title:"Passacaglia (Partita a 3, K.320, g minor)", year:"c.1710", area:"de", areaLabel:"ドイツ/オーストリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"2ヴァイオリン＋チェロ/ヴィオラ＋通奏低音", vid:"VVPEfe7c80A", performer:"Gunar Letzbor (violin, dir.), Ars Antiqua Austria", parentWork:"Partita a 3 in G minor, K.320 (Partite a 3)", startTime:"0:00", videoScope:"movement-only", desc:"オーストリア・バロック巨匠でウィーン宮廷楽長のフクスによるト短調三重奏パルティータ（K.320）の終曲パッサカリア。バッハのBWV 582と同時代のウィーン様式による大規模パッサカリアで、「対位法の教科書」グラドゥス・アド・パルナッスム（1725年）で知られる作曲理論家の傑作器楽作品。アルス・アンティクァ・オーストリア（グナル・レツボル指揮）による演奏で、パルティータの最終楽章として堂々たる変奏を展開する。" },
 { n:304, composer:"Antonio Caldara", dates:"(c.1670–1736)", title:"Ciaccona in B-flat major (Suonate da camera, Op.2 No.12, 1700)", year:"1700", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"2ヴァイオリン＋通奏低音", vid:"wQ66F6NNQSo", performer:"Parnassi Musici (M. MacDuffie, M. Fischer, S. Schrader, M. Lutz)", parentWork:"Suonate da camera a tre, Op.2 (Venice, 1700)", startTime:"0:00", videoScope:"movement-only", desc:"ウィーン宮廷楽長カルダーラの初期傑作「宮廷室内ソナタ集」（Op.2, 1700年）第12番チャッコーナ。既収録の16声部合唱「クルキフィクスス」（n:118）とは対照的な器楽三重奏曲で、2つのヴァイオリンが変ロ長調の反復低音上で縦横に変奏を繰り広げる。コレッリ様式からウィーン・バロック様式への橋渡しをなすヴェネツィア時代の記念碑的作品。パルナッシ・ムジチによる演奏。" },
 { n:305, composer:"Leopold I (attr.) / Johann Heinrich Schmelzer", dates:"(1640–1705 / c.1620–1680)", title:"Ciaconna in G major (attr. Leopold I or Schmelzer)", year:"c.1665–1680", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"弦楽アンサンブル＋通奏低音", vid:"TnEe1zseIMg", performer:"Bremer Barockorchester (Néstor Fabián Cortés Garzón, dir.)", parentWork:"Ms. attr. to Leopold I and/or J.H. Schmelzer", startTime:"0:00", videoScope:"movement-only", desc:"ハプスブルク帝国皇帝レオポルト1世（1640–1705）またはウィーン宮廷楽長ヨハン・ハインリヒ・シュメルツァー（n:30）に帰属するト長調チャッコーナ。200曲超の作品を残した作曲家皇帝レオポルト1世とその師・同僚シュメルツァーの間でオーストリア宮廷写本中の帰属が今日も論争を呼ぶ。ヴィーン宮廷における反復低音文化の絶頂期を代表する弦楽アンサンブル作品で、シュメルツァーのイ長調チャッコーナ（n:30）と並ぶウィーン様式と並ぶ。ブレーマー・バロック・オーケストラ（2024年）による演奏。" },
 { n:306, composer:"Carlo Ambrogio Lonati", dates:"(c.1645–1710)", title:"Ciaccona (XII Sonate a violino solo e basso, 1701)", year:"1701", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チァッコーナ", instr:"バロック・ヴァイオリン＋通奏伴奏", vid:"Iuc33cnnii0", performer:"Ensemble Giardino di Delizie (Ewa Anna Augustynowicz, vn.)", parentWork:"XII Sonate a violino solo e basso (1701)", startTime:"0:00", videoScope:"movement-only", desc:"ミラノ出身のヴァイオリン奏者・作曲家ロナーティによる12曲のヴァイオリン・ソナタ集（1701年）の終曲チャッコーナ。G–D下行音型に基づくオスティナート低音上に独奏ヴァイオリンが変奏を展開する大規模作品。アンサンブル・ジャルディーノ・ディ・デリーツィエ（エヴァ・アンナ・アウグスティノヴィチ、ヴァイオリン）による演奏。" },
 { n:307, composer:"Giovanni Bononcini", dates:"(1670–1747)", title:"Ballo – Passecaille (L'Oracolo d'Apollo, 1707)", year:"1707", area:"it", areaLabel:"イタリア", type:"passacaglia", typeLabel:"パッサカイユ", instr:"室内楽・声楽伺奏", vid:"Zf9huc4FbG0", performer:"Gradus ad Parnassum; Ton Koopman (cond.)", parentWork:"L'Oracolo d'Apollo (cantata con balletto, 1707)", startTime:"29:10", videoScope:"full-work-with-timestamp", desc:"モデナ出身でロンドン・パリで活躍したボノンチーニのカンタータ・コン・バレット「アポロの神託」（1707年）終曲パッサカイユ。フランス語表記「Passecaille」を用いた器楽変奏曲で、イタリア様式にフランスの舞曲語法を取り込んだ作品。トン・コープマン指揮グラドゥス・アド・パルナッスムによる演奏。" },
 { n:308, composer:"Giuseppe Colombi", dates:"(1635–1694)", title:"Ciaccona a basso solo (Ms. I-MOe, Mus.E.350)", year:"c.1670", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チィッコーナ", instr:"バロック・チェロ（バス・ヴァイオリン）", vid:"tUdehEBs6ug", performer:"Charlie Rasmussen (baroque cello)", parentWork:"Ms. I-MOe, Mus.E.350 (Biblioteca Estense, Modena)", startTime:"0:00", videoScope:"movement-only", desc:"ボローニャ楽派のコロンビによるチェロ独奏のチャッコーナ。モデナのエステンセ図書館所蔵手稿（c.1670年）に伝わる作品で、反復する低音型の上に独奏チェロが変奏を展開する。17世紀イタリアにおけるチェロ独奏曲の希少な記録。チャーリー・ラスムッセン（バロック・チェロ）による演奏。" },
 { n:309, composer:"Domenico Mazzocchi", dates:"(1592–1665)", title:"S'io mi parto o mio bel sole – Ciaccona (Ms., c.1640)", year:"c.1640", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チァッコーナ", instr:"テノール（声）＋通奏伴奏", vid:"41pKJLVVhuU", performer:"Riccardo Pisani (tenor); La florida Capella; Marian Polin (dir.)", parentWork:"Ms. (Biblioteca Casanatense, Rome)", startTime:"0:00", videoScope:"movement-only", desc:"ローマのマッツォッキによる声楽チャッコーナ「さらばわが愛しき太陽よ」（c.1640年）。ローマ・カサナテンゼ図書館所蔵手稿に伝わる作品で、反復する低音型の上にテノールが旋律を歌う初期バロック声楽曲。リッカルド・ピサーニ（テノール）、ラ・フロリダ・カペッラ（マリアン・ポーリン指揮）による演奏。" },
 { n:310, composer:"Juan de Araujo", dates:"(1648–1712)", title:"Hola hala que vienen gitanas – Chacona (c.1680)", year:"c.1680", area:"es", areaLabel:"スペイン", type:"ciaccona", typeLabel:"チィッコーナ（チャコーナ）", instr:"声楽・小アンサンブル", vid:"JAwD11aTOAs", performer:"María Cristina Kiehr (soprano); Ensemble Elyma (Gabriel Garrido, dir.)", parentWork:"Cathedral of La Plata (Sucre, Bolivia), manuscript collection", startTime:"0:00", videoScope:"movement-only", desc:"スペイン出身でボリビアのラ・プラタ大聖堂楽長を務めたアラウホによるチャコナ形式のヴィランシーコ「ほら、ジプシーの女たちが来るぞ」（c.1680年）。ヨーロッパ・アフリカ・アメリカ先住民の音楽要素が混在する新大陸バロックの声楽曲。マリア・クリスティーナ・キール（ソプラノ）、アンサンブル・エリマ（ガブリエル・ガリド指揮）による演奏。" },
 { n:311, composer:"Alessandro Poglietti", dates:"(c.1641–1683)", title:"VII. Passacaglia (Toccatina sopra la ribellione di Ungheria, c.1671)", year:"c.1671", area:"de", areaLabel:"ドイツ/オーストリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"チェンバロ", vid:"9Nn7R6xLIso", performer:"Roberto Loreggian (harpsichord)", parentWork:"Toccatina sopra la ribellione di Ungheria (c.1671)", startTime:"0:00", videoScope:"movement-only", desc:"ウィーン宮廷オルガニストのポリエッティによる「ハンガリーの反乱によせる小トッカティーナ」（c.1671年）の終曲パッサカリア。1671年のハプスブルク家反乱事件を描写した7曲組曲の締めくくりで、反復低音上に変奏が展開する。ロベルト・ロレッジャンによるチェンバロ演奏。" },
 { n:312, composer:"Jean-François Dandrieu", dates:"(1682–1738)", title:"Chacone 'La Figurée' (Livre de pièces de clavecin, 1724)", year:"1724", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコーヌ", instr:"チェンバロ", vid:"0-fuqxohHXI", performer:"Andreas Zappe (harpsichord)", parentWork:"Livre de pièces de clavecin (1724)", startTime:"0:00", videoScope:"movement-only", desc:"フランスの鍵盤奏者・作曲家ダンドリューの「クラヴサン曲集」（1724年）所収のシャコンヌ「ラ・フィギュレ（装飾された）」。既収録のパッサカイユ（n:150）と同集のフランス・バロック鍵盤変奏曲。アンドレアス・ツァッペによるチェンバロ演奏。" },
 { n:313, composer:"Antonio Martín y Coll", dates:"(c.1680–1734)", title:"Chacona (Flores de música, 1706)", year:"1706", area:"es", areaLabel:"スペイン", type:"ciaccona", typeLabel:"チャコーナ（シャコーヌ）", instr:"古楽アンサンブル", vid:"gr4DwSFkbpk", performer:"La Ritirata (Josetxu Obregón, dir.)", parentWork:"Flores de música (1706)", startTime:"0:00", videoScope:"movement-only", desc:"スペインの修道士・鍵盤作曲家マルティン・イ・コルの「音楽の花」（フロレス・デ・ムジカ、1706年）所収のチャコナ。スペイン民俗的な舞曲リズムと反復低音を組み合わせた作品。ラ・リティラータ（ホセッチュ・オブレゴン指揮）による打楽器を交えた演奏。" },
 { n:314, composer:"Johann Gottfried Walther", dates:"(1684–1748)", title:"Ciacona sopra 'l canto fermo 'O Jesu, du edle Gabe'", year:"c.1720", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"チャコーナ（シャコーヌ）", instr:"オルガン", vid:"RYJke7msdjs", performer:"Simone Stella (organ)", startTime:"0:00", videoScope:"full-work-with-timestamp", desc:"J.S.バッハの従兄弟にあたる音楽理論家・オルガニストのヴァルターによるオルガン用チャコーナ。コラール「おおイエス、尊き賜物」の定旋律に基づく変奏曲で、ドイツ・バロックの対位法様式で書かれた。シモーネ・ステッラによるオルガン演奏（Brilliant Classics）。" },
 { n:315, composer:"Rupert Ignaz Mayr", dates:"(1646–1712)", title:"Passacaglia-Grave in B-flat major", year:"1692", area:"de", areaLabel:"ドイツ/オーストリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"古楽アンサンブル", vid:"_mLNaQIvbj8", performer:"Musica Antiqua Köln (Reinhard Goebel, dir.)", startTime:"0:00", videoScope:"movement-only", desc:"ミュンヘン宮廷で活躍したドイツのヴァイオリニスト・作曲家マイルによるパッサカリア。1692年の曲集「ピタゴラスの鍛冶屋の火花」に収められた作品で、重厚な和声と美しい旋律が特徴。ラインハルト・ゲーベル率いるムジカ・アンティクア・ケルンの名演。" },
 { n:316, composer:"Heinrich Ignaz Franz Biber", dates:"(1644–1704)", title:"Ciacona (Mystery Sonatas No.4 'The Presentation')", year:"c.1676", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"チャコーナ（シャコーヌ）", instr:"ヴァイオリン＋通奏低音", vid:"fsH9PmcCz4A", performer:"Walter Reiter (violin) / Cordaria", parentWork:"Mystery Sonatas, No. 4 in D minor", startTime:"0:00", videoScope:"movement-only", desc:"ロザリオのソナタ（ミステリー・ソナタ）第4番「神殿への奉献」の主要楽章であるチャコーナ。Dマイナーの短い反復低音の上でヴァイオリンが超絶技巧的な変奏を展開する、バッハ以前のヴァイオリン・シャコーヌの代表的な作品のひとつ。" },
 { n:317, composer:"Heinrich Ignaz Franz Biber", dates:"(1644–1704)", title:"Aria / Guida (Mystery Sonatas No.14 'The Assumption')", year:"c.1676", area:"de", areaLabel:"ドイツ/オーストリア", type:"other", typeLabel:"アリア変奏曲", instr:"ヴァイオリン＋通奏低音", vid:"YgjFPnOz4Ig", performer:"Violin & Continuo", parentWork:"Mystery Sonatas, No. 14 in D major", startTime:"0:00", videoScope:"movement-only", desc:"ロザリオのソナタ第14番「聖母被昇天」のAria。曲名はアリアだが、定型和声・低音に乗せて高度な変奏（ヴァイオリンと通奏低音の掛け合い）が行われるグラウンド・バス的な性質を持つ。" },
 { n:318, composer:"Heinrich Ignaz Franz Biber", dates:"(1644–1704)", title:"Passacaglia for Solo Lute (arr. from Mystery Sonatas No.16)", year:"c.1680s", area:"de", areaLabel:"ドイツ/オーストリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"ソロ・リュート", vid:"gw70yHzD1RE", performer:"Lute", parentWork:"Kremsmünster lute manuscript (L 83)", startTime:"0:00", videoScope:"manuscript-arrangement", desc:"ロザリオのソナタ第16番（Passacaglia in G minor）の、当時に作られたリュート独奏用編曲写本（Kremsmünster L 83）。単なる楽器変更ではなく、当時の演奏習慣や和音の処理を伝える歴史的写本由来のグラウンド・バス作品として独立した価値を持つ。" },
 { n:319, composer:"Heinrich Ignaz Franz Biber", dates:"(1644–1704)", title:"Aria (Harmonia artificioso-ariosa, Partia VI in D major)", year:"1696", area:"de", areaLabel:"ドイツ/オーストリア", type:"other", typeLabel:"アリア変奏曲", instr:"2ヴァイオリン＋通奏低音", vid:"qQyHmI9bPNw", performer:"2 Violins & Continuo", parentWork:"Harmonia artificioso-ariosa, Partia VI in D major (Salzburg, 1696)", startTime:"0:00", videoScope:"movement-only", desc:"パルティータ（組曲）第6番の終曲に置かれたAriaと13の変奏。低音または和声の反復構造を用いており、実質的にシャコーヌ/パッサカリアと同様の変奏原理で書かれている。Biberのアンサンブルにおける変奏技法。" },
 { n:320, composer:"Georg Muffat", dates:"(1653–1704)", title:"Passacaglia (Florilegium Primum, Fasciculus I 'Eusebia')", year:"1695", area:"de", areaLabel:"ドイツ/オーストリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"管弦楽アンサンブル", vid:"vbYLuxEOyEE", performer:"Baroque Orchestra", parentWork:"Florilegium Primum, Fasciculus I 'Eusebia'", startTime:"0:00", videoScope:"movement-only", desc:"ムッファトの管弦楽組曲集『初音草第1集』の第1組曲「エウセビア」に収められたパッサカリア。フランス風の組曲の中にあって、彼がリュリやコレッリから吸収した混合様式が見事に結実した作品。" },
 { n:321, composer:"Georg Muffat", dates:"(1653–1704)", title:"Passacaille (Florilegium Secundum, Fasciculus III 'Illustres Primitiae')", year:"1698", area:"de", areaLabel:"ドイツ/オーストリア", type:"passacaglia", typeLabel:"パッサカイユ", instr:"管弦楽アンサンブル", vid:"CfqkRJLn-5Y", performer:"Baroque Orchestra", parentWork:"Florilegium Secundum, Fasciculus III 'Illustres Primitiae'", startTime:"0:00", videoScope:"movement-only", desc:"ムッファトの管弦楽組曲集『初音草第2集』の第3組曲「輝かしき初物」に収められたパッサカイユ。フランス語表記が示す通り、リュリの影響を色濃く受けた優美で規模の大きな変奏曲。" },
 { n:322, composer:"Georg Muffat", dates:"(1653–1704)", title:"Chaconne (Florilegium Secundum, Fasciculus VIII 'Indissolubilis')", year:"1698", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"シャコーヌ", instr:"管弦楽アンサンブル", vid:"YcIs6SS2qb8", performer:"Baroque Orchestra", parentWork:"Florilegium Secundum, Fasciculus VIII 'Indissolubilis'", startTime:"0:00", videoScope:"movement-only", desc:"『初音草第2集』の第8組曲「不消滅」の終曲に置かれたシャコーヌ。組曲全体を締めくくるにふさわしく、重厚なオスティナート・バスの上で華やかな管弦楽が織りなす。" },
 { n:323, composer:"Henry Purcell", dates:"(1659–1695)", title:"Chaconne 'Two in one upon a Ground' (Dioclesian, Z. 627)", year:"1690", area:"en", areaLabel:"イギリス", type:"ciaccona", typeLabel:"シャコーヌ / グラウンド", instr:"管弦楽アンサンブル・声楽", vid:"is_GKcyX9iQ", performer:"Baroque Ensemble", parentWork:"The Prophetess, or The History of Dioclesian, Z. 627", startTime:"0:00", videoScope:"movement-only", desc:"パーセルの劇音楽『ディオクレティアヌス』に含まれる有名なシャコーヌ。「グラウンド上の2声のカノン」という副題の通り、反復低音の上で上声部が見事なカノンを展開する、イギリス・グラウンドの傑作。" },
 { n:324, composer:"Henry Purcell", dates:"(1659–1695)", title:"Dance for Chinese Man and Woman - Chaconne (The Fairy Queen, Z. 629)", year:"1692", area:"en", areaLabel:"イギリス", type:"ciaccona", typeLabel:"シャコーヌ", instr:"管弦楽アンサンブル", vid:"DY28xMpFbYM", performer:"Baroque Ensemble", parentWork:"The Fairy Queen, Z. 629", startTime:"0:00", videoScope:"movement-only", desc:"パーセルの代表的なセミ・オペラ『妖精の女王』の第5幕に置かれたシャコーヌ。「中国人の男女のための舞曲」として演奏され、英国の劇音楽におけるシャコーヌの劇的な用法を示す苯美な作品。" },
 { n:325, composer:"Dieterich Buxtehude", dates:"(c.1637–1707)", title:"Ostinato (Trio Sonata in B-flat major, Op.1 No.4, BuxWV 255)", year:"1694", area:"de", areaLabel:"ドイツ/オーストリア", type:"other", typeLabel:"オスティナート", instr:"ヴァイオリン・ヴィオラ・ダ・ガンバ＋通奏低音", vid:"Qi7BqNaVe2E", performer:"Ton Koopman & Amsterdam Baroque Orchestra", parentWork:"Trio Sonata in B-flat major, Op.1 No.4, BuxWV 255", startTime:"0:00", videoScope:"movement-only", desc:"ブクステフーデのトリオ・ソナタOp.1の第4番におけるオスティナート楽章。彼の室内楽では「シャコーヌ」「パッサカリア」という明示的な曲名がないまま、32回に及ぶ基低反復の上で華麗なスティルス・ファンタスティクス（幻想様式）が織りなされる。" },
 { n:326, composer:"Marin Marais", dates:"(1656–1728)", title:"Chaconne (Pièces de viole, Livre I, Suite en sol mineur)", year:"1686", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコーヌ", instr:"ヴィオール（ヴィオラ・ダ・ガンバ）＋通奏低音", vid:"qR-QWEkzsO8", performer:"Viola da gamba & Continuo", parentWork:"Pièces de viole, 1er Livre (1686), Suite en sol mineur", startTime:"0:00", videoScope:"movement-only", desc:"マレの『ヴィオール曲集』第1巻に収められたト短調のシャコーヌ。第2巻、第4巻（ラビリンス）に続き、各Livreの組曲を締めくくるシャコーヌの系譜の原点。" },
 { n:327, composer:"Jean-Baptiste Lully", dates:"(1632–1687)", title:"Passacaille (Armide, Act V)", year:"1686", area:"fr", areaLabel:"フランス", type:"passacaglia", typeLabel:"パッサカイユ", instr:"管弦楽アンサンブル・声楽", vid:"MH_uFihnXJc", performer:"Orchestra & Choir", parentWork:"Armide (Tragédie en musique, 1686)", startTime:"0:00", videoScope:"movement-only", desc:"フランス・バロックオペラの頂点とされる『アルミード』第5幕のパッサカイユ。劇的な展開の中でオスティナート・バスが強烈な情念を表現する、リュリの代表作のひとつ。" },
 { n:328, composer:"Romanus Weichlein", dates:"(1652–1706)", title:"Ciaccona (Encaenia musices, Op.1)", year:"1695", area:"de", areaLabel:"オーストリア", type:"ciaccona", typeLabel:"シャコーナ", instr:"管弦楽アンサンブル", vid:"oVz00NYwJtQ", performer:"Ars Antiqua Austria", parentWork:"Encaenia musices, Op.1 (1695)", startTime:"0:00", videoScope:"movement-only", desc:"Biberの影響を色濃く受けたオーストリアの修道士作曲家ヴァイヒラインによる巨大なシャコーナ。当時の南ドイツ・オーストリア圏におけるオスティナート・バスの熱狂を伝える隠れた傑作。" },
 { n:329, composer:"Anonymous (The Balcarres Lute Book)", dates:"(c.1700)", title:"Chaconne / Ground", year:"c.1700", area:"en", areaLabel:"スコットランド", type:"ground", typeLabel:"グラウンド", instr:"リュート", vid:"3m7KDeb3PYA", performer:"Lute", parentWork:"The Balcarres Lute Book", startTime:"0:00", videoScope:"manuscript-arrangement", desc:"17世紀本から18世紀初頭にスコットランドで編纂された『バルカレス・リュート・ブック』に収められた作者不詳のグラウンド（シャコーヌ）。フランスの影響を受けつつも地域性のある舞曲コレクシャンとして貴重な写本。" },
 { n:330, composer:"Anonymous (Rost Manuscript)", dates:"(c.1680)", title:"Passacaglia for scordatura violin", year:"c.1680", area:"de", areaLabel:"ドイツ/オーストリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"ヴァイオリン＋通奏低音", vid:"6kBOJrZOzpY", performer:"Violin & Continuo", parentWork:"Rost Manuscript (Baden-Baden)", startTime:"0:00", videoScope:"manuscript-arrangement", desc:"BiberやSchmelzerと同時代の南ドイツ（バーデン・バーデン）で編纂された『ロスト写本』に残された作者不詳のパッサカリア。スコルダトゥーラ（変則調弦）を用いた高度なヴァイオリン技法が記録されている。" },
 { n:331, composer:"Giovanni Battista Vitali", dates:"(1632–1692)", title:"Passagallo (Artificii musicali, Op.13)", year:"1689", area:"it", areaLabel:"イタリア", type:"passacaglia", typeLabel:"パッサガッロ", instr:"2ヴァイオリン＋通奏低音", vid:"pXCrY9XLK2U", performer:"Baroque Ensemble", parentWork:"Artificii musicali, Op.13 (Modena, 1689)", startTime:"0:00", videoScope:"movement-only", desc:"ボローニャ派の巨匠G.B.ヴィターリが晩年に出版した対位法の技法書的曲集『音楽の巧み』に収められたパッサガッロ。後のコレッリに至るイタリアの反復低音変奏の発展を示す学術的にも重要な作品。" },
 { n:332, composer:"Henry Purcell", dates:"(1659–1695)", title:"Three Parts upon a Ground, Z. 731", year:"c.1680", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンド", instr:"3ヴァイオリン＋通奏低音", vid:"OqEkfwwy7Lo", performer:"Baroque Ensemble", parentWork:"Three Parts upon a Ground, Z. 731", startTime:"0:00", videoScope:"movement-only", desc:"有名なZ.730(Chacony)と対をなす、3つのヴァイオリンと通奏低音のための大作グラウンド。低音の反復の上で3つの上声部が複雑に絡み合うポリフォニックな傑作。" },
 { n:333, composer:"Henry Purcell", dates:"(1659–1695)", title:"A Ground in Gamut, Z. 645", year:"c.1680", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンド", instr:"チェンバロ", vid:"QaAsdkvwQYw", performer:"Harpsichord", parentWork:"A Ground in Gamut, Z. 645", startTime:"0:00", videoScope:"movement-only", desc:"G（Gamut）を基音とする鍵盤用のグラウンド。パーセルの鍵盤作品の中でも特によく知られた教材的な小品でありながら、装飾的な変奏の妙が味わえる。" },
 { n:334, composer:"Henry Purcell", dates:"(1659–1695)", title:"A New Ground in E minor, Z. T682", year:"c.1689", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンド", instr:"チェンバロ", vid:"HKBfq9TkDdk", performer:"Harpsichord", parentWork:"A New Ground in E minor, Z. T682", startTime:"0:00", videoScope:"movement-only", desc:"声楽曲「Here the Deities Approve」の伴奏グラウンドを、鍵盤独奏用にアレンジしたもの。T番号はトランスクリプシャン・鍵盤曲を示す。" },
 { n:335, composer:"Henry Purcell", dates:"(1659–1695)", title:"Ground in D minor, Z. D222", year:"c.1680", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンド", instr:"チェンバロ", vid:"h1yScZFXHSY", performer:"Harpsichord", parentWork:"Ground in D minor, Z. D222", startTime:"0:00", videoScope:"movement-only", desc:"収録済みのC minor (Z.D221)と対になるD minorのグラウンド。D番号はDoubtful（帰属に議論あり）を示すが、パーセルの鍵盤グラウンドとして重要。" },
 { n:336, composer:"Henry Purcell", dates:"(1659–1695)", title:"Chaconne in G minor, Z. T680", year:"1694", area:"en", areaLabel:"イギリス", type:"ciaccona", typeLabel:"シャコーヌ", instr:"チェンバロ", vid:"RfX71LSBgsk", performer:"Harpsichord", parentWork:"Chaconne in G minor, Z. T680", startTime:"0:00", videoScope:"movement-only", desc:"劇音楽『アテネのタイモン』(Z. 632)の幕間音楽として書かれた壮大なシャコーヌを、鍵盤用に編曲したもの。" },
 { n:337, composer:"Henry Purcell", dates:"(1659–1695)", title:"Chaconne (The Gordian Knot Unty'd, Z. 597)", year:"1691", area:"en", areaLabel:"イギリス", type:"ciaccona", typeLabel:"シャコーヌ", instr:"管弦楽アンサンブル", vid:"CnZaQh9TVIg", performer:"Baroque Orchestra", parentWork:"The Gordian Knot Unty'd, Z. 597", startTime:"0:00", videoScope:"movement-only", desc:"劇音楽『ほどかれたゴルディアスの結び目』の組曲を締めくくる壮麗な器楽シャコーヌ。パーセルの付随音楽のなかでも屈指の完成度を誇る名作。" },
 { n:338, composer:"Henry Purcell", dates:"(1659–1695)", title:"Passacaglia 'How happy the lover' (King Arthur, Z. 628)", year:"1691", area:"en", areaLabel:"イギリス", type:"passacaglia", typeLabel:"パッサカリア", instr:"管弦楽・合唱・独唱", vid:"VLlgYA5p9Ck", performer:"Baroque Ensemble & Voices", parentWork:"King Arthur, Z. 628", startTime:"0:00", videoScope:"movement-only", desc:"セミ・オペラ『キング・アーサー』第4幕の長大な声楽パッサカリア。合唱・独唱・器楽リトルネッロが反復低音の上で交錯する、フランス・オペラの様式を英国風に昇華したパーセル最大のパッサカリア。" },
 { n:339, composer:"Henry Purcell", dates:"(1659–1695)", title:"The Plaint 'O let me weep' (The Fairy Queen, Z. 629)", year:"1692", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンド", instr:"ソプラノ・ヴァイオリン・通奏低音", vid:"VxcBV7n52w8", performer:"Soprano & Baroque Ensemble", parentWork:"The Fairy Queen, Z. 629", startTime:"0:00", videoScope:"movement-only", desc:"『妖精の女王』より。半音階的に下降する嘆きの反復低音（ラメント・バス）の上で、ソプラノとヴァイオリン・オブリガートが悲痛に絡み合う。" },
 { n:340, composer:"Henry Purcell", dates:"(1659–1695)", title:"The Triumphing Dance (Dido and Aeneas, Z. 626)", year:"1689", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンド", instr:"管弦楽アンサンブル", vid:"frQlELN_Mw4", performer:"Baroque Orchestra", parentWork:"Dido and Aeneas, Z. 626", startTime:"0:00", videoScope:"movement-only", desc:"オペラ『ディドとエネアス』に含まれる、魔女たちの勝利の踊り。軽快な反復低音の構造を持つ器楽グラウンド。" },
 { n:341, composer:"Henry Purcell", dates:"(1659–1695)", title:"Ah! Belinda (Dido and Aeneas, Z. 626)", year:"1689", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンド", instr:"ソプラノ・通奏低音", vid:"XV9sw5U0Fgc", performer:"Soprano & Continuo", parentWork:"Dido and Aeneas, Z. 626", startTime:"0:00", videoScope:"movement-only", desc:"『ディドとエネアス』第1幕より。有名な「ディドの哀歌」だけでなく、このアリアも厳格なグラウンド・バスの上に書かれている。" },
 { n:342, composer:"Henry Purcell", dates:"(1659–1695)", title:"Oft she visits (Dido and Aeneas, Z. 626)", year:"1689", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンド", instr:"ソプラノ・通奏低音", vid:"W6dEuHVj70Y", performer:"Soprano & Continuo", parentWork:"Dido and Aeneas, Z. 626", startTime:"0:00", videoScope:"movement-only", desc:"『ディドとエネアス』第2幕より。オペラ全体がオスティナートの実験場となっている証明のような声楽グラウンド。" },
 { n:343, composer:"Henry Purcell", dates:"(1659–1695)", title:"'Strike the viol' (Come ye sons of art, Z. 323)", year:"1694", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンド", instr:"アルト独唱・通奏低音", vid:"nCOTHdo7FyM", performer:"Alto & Baroque Ensemble", parentWork:"Come ye sons of art, Z. 323", startTime:"0:00", videoScope:"movement-only", desc:"メアリー女王の誕生日のためのオードより。「ヴィオルを奏でよ」という歌詞の通り、軽快な2小節の反復低音の上でアルト（カウンターテナー）とリコーダーが歌い交わす傑作。" },
 { n:344, composer:"Henry Purcell", dates:"(1659–1695)", title:"'Crown the altar' (Celebrate this festival, Z. 321)", year:"1693", area:"en", areaLabel:"イギリス", type:"ground", typeLabel:"グラウンド", instr:"アルト独唱・通奏低音", vid:"hnbj2Fw_LLM", performer:"Alto & Continuo", parentWork:"Celebrate this festival, Z. 321", startTime:"0:00", videoScope:"movement-only", desc:"同じくメアリー女王の誕生日のためのオードより。グラウンド・バスの名手としてのパーセルの面目躍如たる、極めて美しい声楽グラウンド。" },
 { n:345, composer:"Johann Heinrich Schmelzer", dates:"(c.1620–1680)", title:"Sonata Quarta (Sonatae unarum fidium)", year:"1664", area:"de", areaLabel:"オーストリア", type:"ciaccona", typeLabel:"シャコーナ / パッサカリア", instr:"ヴァイオリン＋通奏低音", vid:"UMhHSN2gE3s", performer:"Baroque Violin & Continuo", parentWork:"Sonatae unarum fidium (1664)", startTime:"0:00", videoScope:"movement-only", desc:"ドイツ語圏で初めて出版されたヴァイオリン・ソナタ集の第4番。下降テトラコルドに基づくパッサカリア的な変奏を中心としており、後のビーベルへと至るオーストリア・ヴァイオリン楽派の原点。" },
 { n:346, composer:"Philipp Heinrich Erlebach", dates:"(1657–1714)", title:"Chaconne (Ouverture No. 4 in D minor)", year:"1693", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"シャコーヌ", instr:"管弦楽アンサンブル", vid:"Ij4he0fZJ8A", performer:"Baroque Orchestra", parentWork:"VI Ouvertures (1693)", startTime:"0:00", videoScope:"movement-only", desc:"エルレバッハの管弦楽組曲（序曲）第4番に含まれるシャコーヌ。フランス風序曲に続く舞曲群の中で、ドイツ的な重厚さを持つ反復低音変奏を展開する。" },
 { n:347, composer:"Jean-Baptiste Lully", dates:"(1632–1687)", title:"Chaconne (Phaëton, LWV 61)", year:"1683", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコーヌ", instr:"管弦楽アンサンブル", vid:"Uew0dnzys9w", performer:"Baroque Orchestra", parentWork:"Phaëton, LWV 61", startTime:"0:00", videoScope:"movement-only", desc:"オペラ『ファエトン』に含まれる有名なシャコーヌ。リュリの作品目録(LWV 61)において明確にシャコーヌと指定されている。（※欠番となっていた349番に補充）" },
 { n:348, composer:"Johann Krieger", dates:"(1651–1735)", title:"Passacaglia in D minor", year:"c.1690", area:"de", areaLabel:"ドイツ", type:"passacaglia", typeLabel:"パッサカリア", instr:"チェンバロ", vid:"uzS21p6zq3I", performer:"Harpsichord", parentWork:"Musicalische Partien", startTime:"0:00", videoScope:"movement-only", desc:"ヨハン・フィリップ・クリーゲル(n:146)の弟であるヨハン・クリーゲルによる鍵盤用パッサカリア。兄に劣らず、後にヘンデルやバッハに影響を与えたドイツ鍵盤楽派の重要な作品。" },
 { n:349, composer:"Georg Friedrich Händel", dates:"(1685–1759)", title:"Passacaille (Radamisto, HWV 12)", year:"1720", area:"de", areaLabel:"ドイツ/イギリス", type:"passacaglia", typeLabel:"パッサカリア", instr:"管弦楽アンサンブル", vid:"HqUn4DnscSU", performer:"Baroque Orchestra", parentWork:"Radamisto, HWV 12", startTime:"0:00", videoScope:"movement-only", desc:"オペラ『ラダミスト』第3幕の全曲を締めくくる壮大なパッサカリア。ヘンデルのオペラのなかでも最も完成された器楽パッサカリアの一つ。" },
 { n:350, composer:"Georg Friedrich Händel", dates:"(1685–1759)", title:"Passacaille (Rodrigo, HWV 5)", year:"1707", area:"de", areaLabel:"ドイツ/イタリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"管弦楽アンサンブル", vid:"n2TVDYdGWY0", performer:"Baroque Orchestra", parentWork:"Rodrigo, HWV 5", startTime:"0:00", videoScope:"movement-only", desc:"若き日のヘンデルがイタリア滞在時に作曲したオペラ『ロドリゴ』の序曲に含まれるパッサカリア。フランス風序曲とイタリア的な情熱が融合している。" },
 { n:351, composer:"Georg Friedrich Händel", dates:"(1685–1759)", title:"Chaconne (Terpsichore / Il pastor fido, HWV 8b)", year:"1734", area:"de", areaLabel:"ドイツ/イギリス", type:"ciaccona", typeLabel:"シャコーヌ", instr:"管弦楽アンサンブル", vid:"JsFb_Vhle4Y", performer:"Baroque Orchestra", parentWork:"Terpsichore / Il pastor fido, HWV 8b", startTime:"0:00", videoScope:"movement-only", desc:"オペラ『忠実な羊飼い』の1734年改訂版に追加されたプロローグ『テルプシコーレ』に含まれる舞踊用の壮麗なシャコーヌ。" },
 { n:352, composer:"Jean-Philippe Rameau", dates:"(1683–1764)", title:"Chaconne (Naïs, RCT 49)", year:"1749", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコーヌ", instr:"管弦楽アンサンブル", vid:"xgLgNf8W_gc", performer:"Baroque Orchestra", parentWork:"Naïs, RCT 49", startTime:"0:00", videoScope:"movement-only", desc:"ラモーのオペラ『ナイス』第1幕におけるシャコーヌ。広がりのあるフランス風の管弦楽法と優美な反復低音が見事な調和を見せる。" },
 { n:353, composer:"Jean-Philippe Rameau", dates:"(1683–1764)", title:"Chaconne (Le Temple de la Gloire, RCT 59)", year:"1745", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコーヌ", instr:"管弦楽アンサンブル", vid:"3L37qXyW3zM", performer:"Baroque Orchestra", parentWork:"Le Temple de la Gloire, RCT 59", startTime:"0:00", videoScope:"movement-only", desc:"オペラ・バレ『栄光の神殿』の第2組曲に収められているシャコーヌ。ボルテールの台本に基づく祝祭的な作品を彩る華やかな一曲。" },
 { n:354, composer:"Johann Sebastian Bach", dates:"(1685–1750)", title:"Chorus: 'Weinen, Klagen, Sorgen, Zagen', BWV 12", year:"1714", area:"de", areaLabel:"ドイツ", type:"passacaglia", typeLabel:"パッサカリア / オスティナート", instr:"合唱＋管弦楽", vid:"GZNg3CWTt14", performer:"Baroque Choir & Orchestra", parentWork:"Cantata BWV 12", startTime:"0:00", videoScope:"movement-only", desc:"バッハの初期カンタータ(BWV 12)の冒頭合唱。半音階的に下降する悲痛なラメント・バスの上で展開される壮絶なパッサカリア。後にロ短調ミサ曲(BWV 232, n:41)の'Crucifixus'へと転用された原曲。" },
 { n:355, composer:"Johann Sebastian Bach", dates:"(1685–1750)", title:"Chorus: 'Jesu, der du meine Seele', BWV 78", year:"1724", area:"de", areaLabel:"ドイツ", type:"ciaccona", typeLabel:"シャコーヌ / オスティナート", instr:"合唱＋管弦楽", vid:"cIWJOKmsgLs", performer:"Baroque Choir & Orchestra", parentWork:"Cantata BWV 78", startTime:"0:00", videoScope:"movement-only", desc:"カンタータBWV 78の冒頭合唱。半音階下降グラウンド・バスが全編を支配する巨大なシャコーヌ/パッサカリア的構造を持ち、合唱と管弦楽が織りなすバッハ声楽オスティナートの代表的な作品のひとつ。" },



 { n:356, composer:"Jean-Baptiste Lully", dates:"(1632–1687)", title:"Chaconne (Isis, LWV 54)", year:"1677", area:"fr", areaLabel:"フランス", type:"ciaccona", typeLabel:"シャコーヌ", instr:"管弦楽アンサンブル", vid:"jcYLc_mx6p0", performer:"Baroque Orchestra", parentWork:"Isis, LWV 54", startTime:"0:00", videoScope:"movement-only", desc:"オペラ『イジス』(1677)の第2幕に登場する優雅なシャコーヌ。フランス・オペラにおける大規模なシャコーヌの典型。" },

 { n:482, composer:"Johann Mattheson", dates:"(1681–1764)", title:"Chaconne in G minor from Pièces de clavecin, Suite No. 5", year:"1714", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"K0iB84__atU", performer:"Jascha Heifetz (violin) & Richard Ellsasser (organ)", parentWork:"Pièces de clavecin, Suite No. 5", desc:"ハンブルクの音楽家マッテゾンの「クラヴサン曲集」第5組曲ト短調シャコンヌ。既収録のリコーダー・シャコンヌ（n:197）と並ぶ変奏曲。ヤッシャ・ハイフェッツ（ヴァイオリン）＆リチャード・エルサッサー（オルガン）による編曲演奏。" },

 { n:484, composer:"Georg Philipp Telemann", dates:"(1681–1767)", title:"Ciacona from Trio Sonata in F minor, TWV 42:f1 - Final Mvt.", year:"c.1720", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"シャコンヌ", instr:"トリオ・ソナタ", vid:"7uJy8u9vUZU", performer:"Masafumi Hirota (violin), Sota Kobayashi & Continuo", parentWork:"Trio Sonata in F minor, TWV 42:f1 - Final Mvt.", desc:"テレマンのトリオ・ソナタ（ヘ短調、TWV 42:f1）終楽章チャッコーナ。廣田正文（ヴァイオリン）、小林壮太を含む通奏低音による演奏。" },
 { n:485, composer:"John Jenkins", dates:"(1592–1678)", title:"The Bell Pavin (Ground) from Consort Works", year:"c.1660", area:"en", areaLabel:"イングランド", type:"ground", typeLabel:"グラウンドバス", instr:"ヴィオラ・ダ・ガンバ / コンソート", vid:"HiLeJQYTYJc", performer:"Hespèrion XX & Jordi Savall", parentWork:"Consort Works", desc:"コンソート作曲家ジェンキンスによる「鐘のパヴァーン（グラウンド）」。反復バス上にヴィオルが変奏を展開するコンソート・グラウンド。エスペリオン20（ジョルディ・サヴァール指揮）による演奏。" },
 { n:486, composer:"William Lawes", dates:"(1602–1645)", title:"Ground (Royall Consort No. 6 in D major) from The Royall Consort", year:"c.1635", area:"en", areaLabel:"イングランド", type:"ground", typeLabel:"グラウンドバス", instr:"ヴィオラ・ダ・ガンバ / コンソート", vid:"kaFo-90F5fU", performer:"Ensemble Tientos & Jorge Daniel Valencia", parentWork:"The Royall Consort", desc:"チャールズ1世の宮廷音楽家ロースの「ロイヤル・コンソート」第6番（ニ長調）グラウンド。既収録のコンソート・グラウンド（n:160）と並ぶ変奏曲。アンサンブル・ティエントスによる演奏。" },
 { n:487, composer:"Matthew Locke", dates:"(1621–1677)", title:"Chaconne from The Broken Consort, Part 1, Suite No. 3 in C major", year:"c.1661", area:"en", areaLabel:"イングランド", type:"ciaccona", typeLabel:"シャコンヌ", instr:"ヴィオ・コンソート", vid:"4ZVVCAtOLXk", performer:"Ensemble Battalia", parentWork:"The Broken Consort, Part 1, Suite No. 3 in C major", desc:"マシュー・ロックの「ブロークン・コンソート」第1部第3組曲（ハ長調）シャコンヌ。既収録のグラウンドバス変奏（n:133）と並ぶ弦楽アンサンブル作品。アンサンブル・バッタリアによる演奏。" },
 { n:488, composer:"Christopher Simpson", dates:"(c.1605–1669)", title:"Division on a Ground in G major from The Division Viol", year:"1659", area:"en", areaLabel:"イングランド", type:"ground", typeLabel:"グラウンドバス", instr:"ヴィオラ・ダ・ガンバ", vid:"bM2vXZyTunk", performer:"Ernst Stolz (viola da gamba)", parentWork:"The Division Viol", desc:"クリストファー・シンプソンの「ディヴィジョン・ヴィオル」（1659年）所収のト長調グラウンド変奏。既収録の変ロ長調（n:292）と対をなす変奏曲。エルンスト・シュトルツ（ヴィオラ・ダ・ガンバ）による演奏。" },
 { n:489, composer:"John Blow", dates:"(1649–1708)", title:"Ground in G minor from Amphion Anglicus", year:"1700", area:"en", areaLabel:"イングランド", type:"ground", typeLabel:"グラウンドバス", instr:"チェンバロ", vid:"EAhktKMZc0A", performer:"Adam Pearl (harpsichord)", parentWork:"Amphion Anglicus", desc:"パーセルの師ブローによるト短調グラウンド。「イギリスのアンフィオン」（1700年）所収の鍵盤変奏曲。既収録の作品（n:57, 105, 222）と並ぶブローの鍵盤グラウンド。アダム・パール（チェンバロ）による演奏。" },
 { n:490, composer:"Gottfried Finger", dates:"(c.1655–1730)", title:"Ground in A minor from 10 Suittes for Flute", year:"1690", area:"de/en", areaLabel:"ドイツ/オーストリア/イングランド", type:"ground", typeLabel:"グラウンドバス", instr:"リコーダー", vid:"rY5pB65jbLU", performer:"Eva Fegers (recorder)", parentWork:"10 Suittes for Flute", desc:"モラヴィア出身でロンドンで活躍したフィンガーによる「フルートのための10の組曲」所収のイ短調グラウンド。既収録の作品（n:412）と並ぶ変奏曲。エヴァ・フェーガース（リコーダー）による演奏。" },
 { n:491, composer:"Gaspar Sanz", dates:"(1640–1710)", title:"Chacona from Instrucción de música sobre la guitarra española", year:"1674", area:"es", areaLabel:"スペイン", type:"ciaccona", typeLabel:"シャコンヌ", instr:"バロック・ギター", vid:"QF70tn9Ppps", performer:"Gabriele Natilla (baroque guitar)", parentWork:"Instrucción de música sobre la guitarra española", desc:"サンスの「ギター演奏の指針」（サラゴサ、1674年）所収のチャコナ。既収録のパサカリェス（n:247）と並ぶスペイン・バロック・ギターの変奏曲。ガブリエレ・ナティッラによる演奏。" },
 { n:492, composer:"Santiago de Murcia", dates:"(1673–1739)", title:"Marionas (Diferencias) from Códice Saldívar No. 4", year:"c.1730", area:"es", areaLabel:"スペイン", type:"diferencias", typeLabel:"ディフェレンシア", instr:"バロック・ギター", vid:"vpGSaTXuHGY", performer:"Francisco Villegas (baroque guitar)", parentWork:"Códice Saldívar No. 4", desc:"ムルシアの「サルディバール写本第4番」（1732年）所収のマリオナス（ディフェレンシア）。既収録のパサカリェ（n:290）・ファンダンゴ（n:291）と並ぶ変奏曲。フランシスコ・ビジェガスによる演奏。" },
 { n:493, composer:"Lucas Ruiz de Ribayaz", dates:"(1626–c.1677)", title:"Pasacalles de primer tono from Luz y Norte Musical", year:"1677", area:"es", areaLabel:"スペイン", type:"passacaglia", typeLabel:"パッサカリア", instr:"バロック・ハープ / ギター", vid:"RDsNpkY7efo", performer:"Baroque Ensemble", parentWork:"Luz y Norte Musical", desc:"リバヤスの「音楽の光と北極星」（マドリード、1677年）所収の第1旋法パサカリェス。既収録のチャコナ・マリオナ（n:258）と並ぶ変奏曲。バロック・アンサンブルによる演奏。" },
 { n:494, composer:"Antonio Martín y Coll", dates:"(d. 1734)", title:"Diferencias sobre las folías from Flores de Música", year:"c.1706", area:"es", areaLabel:"スペイン", type:"folia", typeLabel:"フォリア", instr:"オルガン", vid:"yKeDTG1IFYo", performer:"Ana Aguado (organ)", parentWork:"Flores de Música", desc:"マルティン・イ・コルの「音楽の花」所収のフォリア変奏（ディフェレンシア）。既収録のフォリア（n:142）・チャコナ（n:313）と並ぶ鍵盤変奏曲。アナ・アグアド（オルガン）による演奏。" },
 { n:495, composer:"Juan Bautista Cabanilles", dates:"(1644–1712)", title:"Pasacalles de cuarto tono from Keyboard Works", year:"c.1690", area:"es", areaLabel:"スペイン", type:"passacaglia", typeLabel:"パッサカリア", instr:"オルガン", vid:"3Svo2D4civo", performer:"Paulino Ortiz (organ)", parentWork:"Keyboard Works", desc:"バレンシア大聖堂オルガン奏者カバニリェスによるパサカリェス第4旋法。既収録のフォリア（n:161）・パサカリェス（n:246）と並ぶスペイン・バロック鍵盤変奏曲。パウリーノ・オルティスによるオルガン演奏。" },
 { n:496, composer:"Sebastián Durón", dates:"(1660–1716)", title:"Jácara (Diferencias) from Música de escena", year:"c.1700", area:"es", areaLabel:"スペイン", type:"diferencias", typeLabel:"ディフェレンシア", instr:"バロック・アンサンブル", vid:"JrT3KNI2QLI", performer:"Le Poème Harmonique & Vincent Dumestre", parentWork:"Música de escena", desc:"スペイン宮廷楽長ドゥロンによる舞台音楽のハカラ（ディフェレンシア）。スペイン民俗的舞曲の反復低音型を用いた変奏曲。ル・ポエム・アルモニーク（ヴァンサン・デュメストル指揮）による演奏。" },
 { n:497, composer:"Johann Joseph Fux", dates:"(1660–1741)", title:"Ciaccona in D major, K.403", year:"c.1700", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"シャコンヌ", instr:"チェンバロ", vid:"SbZof5nzbU4", performer:"Fernando De Luca (harpsichord)", startTime:"0:00", videoScope:"movement-only", desc:"ウィーン宮廷楽長フクスによるチェンバロのニ長調チャッコーナ（K.403）。既収録のパッサカリア（n:303）・管弦楽パッサカイユ（n:422）と並ぶフクスの器楽変奏曲。フェルナンド・デ・ルカ（チェンバロ）による演奏。" },

  { n:498, composer:"Johann Sebastian Bach", dates:"(1685–1750)", title:"Aria variata alla maniera italiana in A minor, BWV 989", year:"c.1706–1714", area:"de", areaLabel:"ドイツ/オーストリア", type:"ground", typeLabel:"アリア変奏 / バス変奏", instr:"鍵盤楽器", vid:"2eiG7j-hjno", performer:"", parentWork:"", startTime:"0:00", videoScope:"movement-only", desc:"イタリア風のアリアに基づく鍵盤変奏曲。シャコンヌ／パッサカリアという題名ではないが、最古資料の略題はイタリア鍵盤音楽に典型的な「バスに基づく変奏」を指す。バッハのゴルトベルク変奏曲以前の重要なbass-based variationとして位置づけられる。アリアと10の変奏からなる。" },
  { n:499, composer:"Heinrich Ignaz Franz Biber", dates:"(1644–1704)", title:"Passagaglia - Adagissimo from Violin Sonata in C minor, C.107", year:"before 1681", area:"de", areaLabel:"ドイツ/オーストリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"ヴァイオリン＋通奏低音", vid:"6SaBs6QIZEo", performer:"Gunar Letzbor / Ars Antiqua Austria / Salzburg Lute Consort", parentWork:"Violin Sonata in C minor, C.107", movement:"Passagaglia - Adagissimo", startTime:"0:00", videoScope:"movement-only", desc:"ビーバーのハ短調ヴァイオリン・ソナタ C.107 の中核をなすパッサカリア楽章。ロザリオ・ソナタ終曲の独奏パッサカリア C.105 とは別作品で、のちの1681年刊《Sonatae violino solo》に連なる初期ソナタとして位置づけられる。反復低音の上でヴァイオリンが濃密な変奏を展開する。" },
  { n:500, composer:"Heinrich Ignaz Franz Biber", dates:"(1644–1704)", title:"Ciacona from Violin Sonata No. 7 in G major, C.144", year:"1681", area:"de", areaLabel:"ドイツ/オーストリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"ヴァイオリン＋通奏低音", vid:"GfvCQ1-tbYQ", performer:"Igor Ruhadze / Ensemble Violini Capricciosi", parentWork:"Sonatae violino solo (1681)", movement:"Sonata VII in G major, C.144 - Ciacona", startTime:"1:53", videoScope:"full-work-with-timestamp", desc:"ビーバー《Sonatae violino solo》(1681) の第7ソナタに含まれるチャッコーナ。通しトラック内の該当箇所を1:53開始で登録。ロザリオ・ソナタ終曲やC.107のパッサカリアとは別作品で、反復和声上にヴァイオリンの変奏が展開する。" },
  { n:501, composer:"Heinrich Ignaz Franz Biber", dates:"(1644–1704)", title:"Passacaglia from Violin Sonata No. 6 in C minor, C.143", year:"1681", area:"de", areaLabel:"ドイツ/オーストリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"ヴァイオリン＋通奏低音", vid:"HYBmeYalGFs", performer:"Igor Ruhadze / Ensemble Violini Capricciosi", parentWork:"Sonatae violino solo (1681)", movement:"Sonata VI in C minor, C.143 - Passacaglia", startTime:"1:32", videoScope:"full-work-with-timestamp", desc:"ビーバー《Sonatae violino solo》(1681) の第6ソナタに含まれるパッサカリア。通しトラック内の該当箇所を1:32開始で登録。部分的スコルダトゥーラを伴うハ短調ソナタの中核的な変奏楽章で、反復低音上に濃密なヴァイオリン書法が展開する。" },
  { n:502, composer:"Maurizio Cazzati", dates:"(1616–1678)", title:"Capriccio sopra sette note", year:"1651 or before", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ系カプリッチョ", instr:"2ヴァイオリン＋ヴィオローネ＋通奏低音", vid:"DYR-rEIN5RQ", performer:"Sonatori de la Gioiosa Marca", parentWork:"Correnti, balletti, galiarde", startTime:"0:00", videoScope:"movement-only", desc:"カッツァーティの「7つの音の上のカプリッチョ」。失われた初版を含む1651年以前の《Correnti, balletti, galiarde》系作品で、2つのヴァイオリンと通奏低音が短い反復素材の上で軽快に展開する。既収録のカッツァーティのチャッコーナ群（n:116, n:296, n:436）を補う初期ボローニャ器楽の好例。" },
  { n:503, composer:"Giovanni Zamboni", dates:"(c.1664–1721)", title:"Ceccona", year:"1718", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"チャッコーナ", instr:"アーチリュート / リュート", vid:"7HmxPVo9KOc", performer:"Anna Kowalska (liuto attiorbato)", parentWork:"Sonate d'intavolatura di leuto, Op.1", startTime:"0:34", videoScope:"full-work-with-timestamp", desc:"ザンボーニ《リュートのためのタブラチュア・ソナタ集 Op.1》(1718) に付されたCeccona。CecconaはCiaccona/Chaconneの綴り揺れとして扱い、0:34から始まる該当箇所を登録。後期イタリア・リュート音楽に残る独奏チャッコーナの貴重な例。" },
  { n:504, composer:"Antonio Carbonchi", dates:"(fl. 1640s)", title:"Passacaglio passeggiato per D", year:"1640", area:"it", areaLabel:"イタリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"バロック・ギター", vid:"psx_UFVcTfE", performer:"Timo Peedu (baroque guitar)", parentWork:"Sonate di chitarra spagnola", startTime:"0:00", videoScope:"movement-only", desc:"カルボンキ《スペイン式ギターのソナタ集》(1640) 系のパッサカリオ。Ceccona検索から派生して見つかった未収録候補で、イタリア初期バロック・ギターにおけるパッサカリア／チャッコーナ文化を補う一曲。" },
  { n:505, composer:"Girolamo Frescobaldi", dates:"(1583–1643)", title:"Ceccona: Deh, vien da me pastorella", year:"1630", area:"it", areaLabel:"イタリア", type:"ciaccona", typeLabel:"声楽チャッコーナ", instr:"2テノール＋通奏低音", vid:"ad8J7xVqyKM", performer:"cantoLX / Frank Agsteribbe", parentWork:"Secondo libro d'arie musicali", startTime:"0:00", videoScope:"movement-only", desc:"フレスコバルディ《アリエ・ムジカーリ第2巻》(1630) の声楽Ceccona「Deh, vien da me pastorella」。既収録の鍵盤用チャッコーナ群とは別作品で、チャッコーナ低音を声楽作品に応用した重要例。レチタティーヴォ的な挿入を交えながら反復型が自由に展開する。" },
  { n:506, composer:"Benjamin Britten", dates:"(1913–1976)", title:"Peter Grimes: Passacaglia", year:"1945", area:"en", areaLabel:"イングランド", type:"passacaglia", typeLabel:"パッサカリア", instr:"管弦楽", vid:"5SKpVYAsEa8", performer:"CYSO Symphony Orchestra / Allen Tinkham", startTime:"0:00", videoScope:"movement-only", desc:"オペラ《ピーター・グライムズ》から独立して演奏されるパッサカリア。20世紀の代表的なパッサカリアとして、管弦楽の反復低音と緊張の累積が明確に聴ける。" },
  { n:507, composer:"Dmitri Shostakovich", dates:"(1906–1975)", title:"Violin Concerto No. 1 in A minor, Op. 77: III. Passacaglia", year:"1947–48", area:"ru", areaLabel:"ロシア/ソ連", type:"passacaglia", typeLabel:"パッサカリア", instr:"ヴァイオリン協奏曲", vid:"uSGzydGcSPk", performer:"Hilary Hahn", startTime:"0:00", videoScope:"movement-only", desc:"《ヴァイオリン協奏曲第1番》第3楽章。低音主題の反復に独奏ヴァイオリンの長いカデンツァへ向かう大きな弧を重ねた、ショスタコーヴィチの重要なパッサカリア。" },
  { n:508, composer:"Anton Webern", dates:"(1883–1945)", title:"Passacaglia for Orchestra, Op. 1", year:"1908", area:"at", areaLabel:"オーストリア", type:"passacaglia", typeLabel:"パッサカリア", instr:"管弦楽", vid:"OLW1w675NHY", performer:"Pierre Boulez / London Symphony Orchestra", startTime:"0:00", videoScope:"complete-work", desc:"ヴェーベルンの作品番号1。シェーンベルク門下時代の大規模な管弦楽パッサカリアで、後期ロマン派的な響きの中に厳密な変奏構造を置く。" },
  { n:509, composer:"Max Reger", dates:"(1873–1916)", title:"Introduction, Passacaglia und Fuge, Op. 127: II. Passacaglia", year:"1913", area:"de", areaLabel:"ドイツ", type:"passacaglia", typeLabel:"パッサカリア", instr:"オルガン", vid:"5adLlhbjXXA", performer:"Bernhard Schneider", startTime:"0:00", videoScope:"movement-only", desc:"レーガー晩年の大作《導入、パッサカリアとフーガ》Op.127のパッサカリア楽章。バッハ以後のドイツ・オルガン伝統を20世紀初頭に引き継ぐ濃密な変奏。" },
  { n:510, composer:"Josef Rheinberger", dates:"(1839–1901)", title:"Organ Sonata No. 8 in E minor, Op. 132: Passacaglia", year:"1882", area:"de", areaLabel:"ドイツ/リヒテンシュタイン", type:"passacaglia", typeLabel:"パッサカリア", instr:"オルガン", vid:"eHKlIsdPF5w", performer:"YouTube candidate", startTime:"0:00", videoScope:"movement-only", desc:"《オルガン・ソナタ第8番》終楽章のパッサカリア。ロマン派オルガン・ソナタ内に置かれた、明快な反復低音型の変奏楽章。" },

];

const typeColors = {
 ciaccona:'type-ciaccona', passacaglia:'type-passacaglia', folia:'type-folia',
 ground:'type-ground', romanesca:'type-romanesca', diferencias:'type-diferencias', other:'type-other'
};
const areaColors = { es:'area-es', it:'area-it-early', de:'area-de', at:'area-at', fr:'area-fr', en:'area-en', pl:'area-pl', ru:'area-ru' };

let activeType = 'all', activeArea = 'all', searchQ = '';
let currentVisibleTracks = [];

function render() {
 const grid = document.getElementById('grid');
 const q = searchQ.toLowerCase();
 let visible = 0;
 currentVisibleTracks = [];
 grid.innerHTML = '';
 tracks.forEach(t => {
  const matchType = activeType === 'all' || t.type === activeType;
  const matchArea = activeArea === 'all' || t.area.split('/').includes(activeArea);
  const matchSearch = !q || t.composer.toLowerCase().includes(q) || t.title.toLowerCase().includes(q) || (t.desc && t.desc.toLowerCase().includes(q));
  if (!matchType || !matchArea || !matchSearch) return;
  currentVisibleTracks.push(t);
  visible++;
  const typeClass = typeColors[t.type] || 'type-other';
  const areaClass = areaColors[t.area] || 'area-it-early';
  let ytUrl = `https://www.youtube.com/watch?v=${t.vid}`;
  if (t.startTime) {
   let parts = t.startTime.split(':').reverse();
   let sec = (parseInt(parts[0]) || 0) + (parseInt(parts[1]) || 0) * 60 + (parseInt(parts[2]) || 0) * 3600;
   if (sec > 0 || t.videoScope === 'full-work-with-timestamp') {
    ytUrl += `&t=${sec}s`;
   }
  }

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
   <div class="card-header">
    <span class="num">#${t.n}</span>
    <span class="type-badge ${typeClass}">${t.typeLabel}</span>
    <span class="area-dot ${areaClass}" title="${t.areaLabel}"></span>
    <span style="color:var(--muted);font-size:0.7rem;flex:1">${t.year}</span>
   </div>
   <div class="card-body">
    <div class="composer">${t.composer} <span class="composer-dates">${t.dates}</span></div>
    <div class="title">${t.title}</div>
    ${t.parentWork ? `<div style="font-size:0.69rem;color:var(--muted);margin:2px 0 4px;line-height:1.4;"><span style="font-style:italic">${t.parentWork}</span>${t.movement ? ' ／ <strong style="color:var(--text)">' + t.movement + '</strong>' : ''} <span style="display:inline-block;padding:0 4px;border-radius:2px;background:#4a7c59;color:#fff;font-size:0.6rem;font-weight:700;vertical-align:middle;">楽章のみ</span></div>` : ''}
    <div class="meta"><span class="instrument">${t.instr}</span></div>
    <div class="desc">${t.desc}</div>
    <div class="performer">演奏: ${t.performer}</div>
   </div>
   <div class="card-footer">
    <a class="yt-btn" href="${ytUrl}" target="_blank" rel="noopener">
     <span class="yt-icon">&#9654;</span> YouTubeで視聴
    </a>
    <span class="area-label">${t.areaLabel}</span>
   </div>`;
  grid.appendChild(card);
 });
 document.getElementById('stats').textContent = `${visible} 曲表示中（全 ${tracks.length} 曲）`;
}

document.querySelectorAll('.btn[data-filter]').forEach(btn => {
 btn.addEventListener('click', () => {
  const f = btn.dataset.filter, v = btn.dataset.val;
  document.querySelectorAll(`.btn[data-filter="${f}"]`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (f === 'type') activeType = v;
  else activeArea = v;
  render();
 });
});

document.getElementById('search').addEventListener('input', e => {
 searchQ = e.target.value;
 render();
});

document.getElementById('randomPlayBtn').addEventListener('click', () => {
 if (currentVisibleTracks.length === 0) {
  alert('再生可能な曲がありません。条件を変更してください。');
  return;
 }
 const t = currentVisibleTracks[Math.floor(Math.random() * currentVisibleTracks.length)];
 let ytUrl = `https://www.youtube.com/watch?v=${t.vid}`;
 if (t.startTime) {
  let parts = t.startTime.split(':').reverse();
  let sec = (parseInt(parts[0]) || 0) + (parseInt(parts[1]) || 0) * 60 + (parseInt(parts[2]) || 0) * 3600;
  if (sec > 0 || t.videoScope === 'full-work-with-timestamp') {
   ytUrl += `&t=${sec}s`;
  }
 }
 window.open(ytUrl, '_blank', 'noopener,noreferrer');
});

render();
</script>
</body>
</html>
